<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Recipes</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap');

:root {
  --dark-bg: #121212;
  --card-bg: #1e1e1e;
  --text-color: #e0e0e0;
  --accent: #f5f5f5;
  --hover-shadow: rgba(255,255,255,0.1);
}

body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  background: var(--dark-bg);
  color: var(--text-color);
}

header {
  background: #000;
  color: var(--accent);
  padding: 25px 15px;
  text-align: center;
  letter-spacing: 1px;
}

header h1 {
  margin: 0;
  font-weight: 600;
  font-size: 2.2rem;
}

.grid {
  display: grid;
  gap: 20px;
  padding: 20px;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
}

.card {
  background: var(--card-bg);
  border-radius: 14px;
  padding: 20px;
  cursor: pointer;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  box-shadow: 0 4px 12px var(--hover-shadow);
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 20px var(--hover-shadow);
}

.card h3 {
  margin: 0;
  font-size: 1.3rem;
  font-weight: 600;
  text-align: center;
  color: var(--accent);
}

/* Modal Styles */
.modal-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  display: none;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
  z-index: 10;
}

.modal {
  background: var(--card-bg);
  color: var(--text-color);
  padding: 30px;
  border-radius: 16px;
  width: 90%;
  max-width: 650px;
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
  box-shadow: 0 8px 25px rgba(0,0,0,0.7);
}

.modal h2 {
  margin-top: 0;
  color: var(--accent);
  border-bottom: 1px solid var(--accent);
  padding-bottom: 10px;
}

.modal .section-title {
  font-weight: 600;
  margin-top: 18px;
  color: var(--accent);
}

.modal p, .modal li {
  color: var(--text-color);
  line-height: 1.6;
  font-size: 0.95rem;
}

.close-btn {
  position: absolute;
  top: 15px;
  right: 15px;
  background: var(--accent);
  color: #000;
  border: none;
  padding: 7px 12px;
  font-size: 1rem;
  cursor: pointer;
  border-radius: 8px;
}
</style>
</head>
<body>

<header>
  <h1>My Recipes</h1>
</header>

<div class="grid" id="recipe-grid">
  Loading recipes...
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <button class="close-btn" id="close-btn">X</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
const jsonURL = 'https://raw.githubusercontent.com/gi22i/recipes-app/refs/heads/main/Recipes.json';

async function fetchRecipes() {
  const response = await fetch(jsonURL + '?cb=' + new Date().getTime());
  return await response.json();
}

function showModal(recipe) {
  const html = `
    <h2>${recipe.title}</h2>
    <div class="section-title">Ingredients</div>
    <ul>${recipe.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
    <div class="section-title">Method</div>
    <p>${recipe.instructions}</p>
    <div class="section-title">Macros</div>
    <p>${recipe.macros || 'N/A'}</p>
    ${recipe.notes ? `<div class="section-title">Notes</div><p>${recipe.notes}</p>` : ''}
  `;
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-bg').style.display = 'flex';
}

function initGrid(recipes) {
  const grid = document.getElementById('recipe-grid');
  grid.innerHTML = '';
  recipes.forEach(recipe => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h3>${recipe.title}</h3>`;
    card.addEventListener('click', () => showModal(recipe));
    grid.appendChild(card);
  });
}

document.getElementById('close-btn').addEventListener('click', () => {
  document.getElementById('modal-bg').style.display = 'none';
});

fetchRecipes().then(initGrid);
</script>

</body>
</html>
