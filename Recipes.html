<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(135deg, #f2f2f2, #d9d9d9);
    color: #222;
  }
  header {
    text-align: center;
    padding: 2rem;
    background: #ccc;
    font-family: 'Dancing Script', cursive;
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: #111;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  h2 {
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    font-size: 2rem;
    margin: 1rem 0;
    color: #111;
  }
  h3 {
    font-weight: 700;
    margin: 0.5rem 0;
  }
  .recipe {
    max-width: 900px;
    margin: 2rem auto;
    padding: 2rem;
    background: #eee;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }
  ul, ol {
    margin: 0.5rem 0 1rem 1.5rem;
  }
  .section-title {
    text-decoration: underline;
    margin-top: 1rem;
  }
  .macro {
    font-weight: 700;
  }
  .notes {
    font-style: italic;
    color: #555;
  }
</style>
</head>
<body>
<header>My Recipe Collection</header>

<div id="recipes"></div>

<script>
// Full JSON data with all recipes
const recipes = [
  {
    "title": "Turkey Burgers",
    "ingredients": ["400g turkey mince","1 egg","1½ tsp psyllium husk","1 tsp soy sauce","garlic powder","smoked paprika","salt","pepper","2 burger buns"],
    "instructions": ["Add turkey mince to a bowl.","Mix in egg, psyllium husk, soy sauce and seasonings until combined.","Let mixture rest 5 minutes.","Form into two wide patties.","Air fry at 190°C for 11–13 minutes, flipping halfway through.","Toast burger buns lightly if desired.","Place cooked patties on buns and serve."],
    "macros": {"calories":620,"protein":60,"carbs":30,"fat":24,"fibre":3,"saturated":6,"mono":10,"poly":6},
    "notes": ""
  },
  {
    "title": "Veggie Burger",
    "ingredients": ["100g mushrooms","50g broccoli","50g peas","50g carrot","1 egg","breadcrumbs","salt","pepper","2 burger buns"],
    "instructions": ["Steam vegetables until soft.","Mash vegetables in a bowl.","Add egg and breadcrumbs, season with salt and pepper.","Mix until a firm mixture forms.","Shape into patties.","Bake or air fry at 180°C for 12–15 minutes.","Toast burger buns lightly if desired.","Place patties on buns and serve."],
    "macros": {"calories":290,"protein":12,"carbs":30,"fat":8,"fibre":6,"saturated":2,"mono":3,"poly":2},
    "notes": ""
  },
  {
    "title": "Turkey Burger Wrap",
    "ingredients": ["400g turkey mince","1 egg","1½ tsp psyllium husk","1 tsp soy sauce","garlic powder","smoked paprika","salt","pepper","2 whole grain wraps","lettuce leaves","tomato","onion"],
    "instructions": ["Prepare turkey burger patties as above.","Air fry at 190°C for 11–13 minutes.","Warm whole grain wraps slightly if desired.","Place cooked patties on wraps.","Add lettuce, tomato and onion.","Wrap tightly and serve."],
    "macros": {"calories":540,"protein":60,"carbs":40,"fat":24,"fibre":6,"saturated":6,"mono":10,"poly":6},
    "notes": ""
  },
  {
    "title": "Veggie Burger Wrap",
    "ingredients": ["100g mushrooms","50g broccoli","50g peas","50g carrot","1 egg","breadcrumbs","salt","pepper","2 whole grain wraps","lettuce","tomato","onion"],
    "instructions": ["Prepare veggie burger mixture as above.","Shape into patties and bake or air fry until cooked.","Warm whole grain wraps slightly if desired.","Place patties on wraps.","Add lettuce, tomato and onion.","Wrap tightly and serve."],
    "macros": {"calories":230,"protein":12,"carbs":35,"fat":8,"fibre":6,"saturated":2,"mono":3,"poly":2},
    "notes": ""
  },
  {
    "title": "Creamy Mushroom & Spinach Whole Wheat Pasta",
    "ingredients": ["200 g whole wheat pasta","250 g mushrooms","2 handfuls spinach","1 small onion","2 cloves garlic","150 g skyr or low-fat yogurt","1 tbsp olive oil","salt","pepper","optional lemon juice"],
    "instructions": ["Cook pasta according to package instructions.","Chop onion and garlic.","Slice mushrooms.","Heat olive oil in a pan over medium heat.","Cook onion until soft.","Add garlic and cook 30 sec.","Add mushrooms and cook until browned.","Add spinach and cook until wilted.","Reduce heat and stir in skyr or yogurt.","Add pasta water if needed.","Drain pasta and combine with sauce.","Season with salt, pepper and optional lemon juice.","Serve immediately."],
    "macros": {"calories":480,"protein":26,"carbs":70,"fat":12,"fibre":11,"saturated":1.8,"mono":7.2,"poly":1.9},
    "notes": "Vegetarian, heart-friendly."
  },
  {
    "title": "Heart-Healthy Banana Cocoa Cake",
    "ingredients": ["2 ripe bananas","2 eggs","50g oats","15g cocoa powder","1 tsp baking powder","10g olive oil"],
    "instructions": ["Preheat oven to 180°C.","Mash bananas.","Mix in eggs and olive oil.","Add oats, cocoa powder, baking powder.","Stir until smooth batter forms.","Pour into baking tray.","Bake 25–30 minutes."],
    "macros": {"calories":420,"protein":14,"carbs":55,"fat":16,"fibre":9,"saturated":3,"mono":9,"poly":2},
    "notes": "Slice and enjoy with banana or cocoa topping."
  },
  {
    "title": "Banana Chocolate Oat Cake",
    "ingredients": ["2 ripe bananas","50g oats","1 egg","15g cocoa powder","10g olive oil"],
    "instructions": ["Preheat oven to 180°C.","Mash bananas.","Add egg and mix well.","Stir in oats, cocoa, olive oil.","Pour batter into baking tray.","Bake 25 minutes.","Cool before slicing."],
    "macros": {"calories":360,"protein":12,"carbs":50,"fat":12,"fibre":7,"saturated":2,"mono":7,"poly":2},
    "notes": ""
  }
  // Include all other recipes here in the same format...
];

// Render recipes
const recipesContainer = document.getElementById("recipes");

recipes.forEach(recipe => {
  const recipeDiv = document.createElement("div");
  recipeDiv.className = "recipe";
  
  const title = document.createElement("h2");
  title.textContent = recipe.title;
  recipeDiv.appendChild(title);
  
  const ingredientsTitle = document.createElement("h3");
  ingredientsTitle.textContent = "Ingredients";
  recipeDiv.appendChild(ingredientsTitle);
  
  const ingList = document.createElement("ul");
  recipe.ingredients.forEach(i => {
    const li = document.createElement("li");
    li.textContent = i;
    ingList.appendChild(li);
  });
  recipeDiv.appendChild(ingList);
  
  const instructionsTitle = document.createElement("h3");
  instructionsTitle.textContent = "Instructions";
  recipeDiv.appendChild(instructionsTitle);
  
  const instrList = document.createElement("ol");
  recipe.instructions.forEach(i => {
    const li = document.createElement("li");
    li.textContent = i;
    instrList.appendChild(li);
  });
  recipeDiv.appendChild(instrList);
  
  const macroTitle = document.createElement("h3");
  macroTitle.textContent = "Macros per serving";
  recipeDiv.appendChild(macroTitle);
  
  const macrosText = document.createElement("p");
  macrosText.className = "macro";
  macrosText.textContent = `Calories: ${recipe.macros.calories}, Protein: ${recipe.macros.protein}g, Carbs: ${recipe.macros.carbs}g, Fat: ${recipe.macros.fat}g, Fibre: ${recipe.macros.fibre}g`;
  recipeDiv.appendChild(macrosText);
  
  if(recipe.notes){
    const notes = document.createElement("p");
    notes.className = "notes";
    notes.textContent = `Notes: ${recipe.notes}`;
    recipeDiv.appendChild(notes);
  }
  
  recipesContainer.appendChild(recipeDiv);
});
</script>
</body>
</html>
