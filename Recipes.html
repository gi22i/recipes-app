<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Recipe App</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f8f1f1;
    margin: 0;
    padding: 0;
}
header {
    background: #ff7f50;
    color: white;
    padding: 1rem;
    text-align: center;
}
#sync-btn {
    background: #fff;
    color: #ff7f50;
    border: none;
    padding: 0.5rem 1rem;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
    margin-top: 0.5rem;
}
#recipes-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    padding: 1rem;
}
.recipe-card {
    background: white;
    width: 280px;
    margin: 1rem;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    cursor: pointer;
    transition: transform 0.2s;
}
.recipe-card:hover {
    transform: scale(1.03);
}
.recipe-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}
.recipe-card h3 {
    margin: 0.5rem;
    font-size: 1.1rem;
    color: #333;
}
.recipe-card p {
    margin: 0.5rem;
    font-size: 0.9rem;
    color: #555;
}
#recipe-detail {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    overflow-y: auto;
    padding: 2rem;
    box-sizing: border-box;
}
#recipe-detail img {
    width: 100%;
    max-width: 400px;
    display: block;
    margin: 0 auto 1rem auto;
    border-radius: 10px;
}
#recipe-detail h2 {
    color: white;
    text-align: center;
}
#recipe-detail p {
    color: #f0f0f0;
    line-height: 1.5;
    margin: 1rem 0;
}
#close-btn {
    display: block;
    background: #ff7f50;
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    margin: 1rem auto;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>
<body>
<header>
  <h1>My Recipes</h1>
  <button id="sync-btn">Sync Recipes</button>
</header>

<div id="recipes-container"></div>

<div id="recipe-detail">
  <img id="detail-img" src="" alt="Recipe Image">
  <h2 id="detail-title"></h2>
  <p id="detail-ingredients"></p>
  <p id="detail-method"></p>
  <button id="close-btn">Close</button>
</div>

<script>
const jsonURL = 'https://raw.githubusercontent.com/gi22i/recipes-app/main/Recipes.json';

const recipesContainer = document.getElementById('recipes-container');
const recipeDetail = document.getElementById('recipe-detail');
const detailImg = document.getElementById('detail-img');
const detailTitle = document.getElementById('detail-title');
const detailIngredients = document.getElementById('detail-ingredients');
const detailMethod = document.getElementById('detail-method');
const closeBtn = document.getElementById('close-btn');
const syncBtn = document.getElementById('sync-btn');

let recipes = [];

function renderRecipes() {
  recipesContainer.innerHTML = '';
  recipes.forEach((recipe, index) => {
    const card = document.createElement('div');
    card.className = 'recipe-card';
    card.innerHTML = `
      <img src="${recipe.image}" alt="${recipe.title}">
      <h3>${recipe.title}</h3>
      <p>${recipe.ingredients.split(',').slice(0,3).join(', ')}...</p>
    `;
    card.addEventListener('click', () => showDetail(index));
    recipesContainer.appendChild(card);
  });
}

function showDetail(index) {
  const recipe = recipes[index];
  detailImg.src = recipe.image;
  detailTitle.textContent = recipe.title;
  detailIngredients.textContent = "Ingredients: " + recipe.ingredients;
  detailMethod.textContent = "Method: " + recipe.method;
  recipeDetail.style.display = 'block';
}

closeBtn.addEventListener('click', () => {
  recipeDetail.style.display = 'none';
});

syncBtn.addEventListener('click', () => {
  fetch(jsonURL)
    .then(response => response.json())
    .then(data => {
      recipes = data;
      renderRecipes();
      alert('Recipes synced successfully!');
    })
    .catch(err => {
      console.error(err);
      alert('Failed to sync recipes.');
    });
});

// Initial load
fetch(jsonURL)
  .then(response => response.json())
  .then(data => {
    recipes = data;
    renderRecipes();
  })
  .catch(err => console.error('Failed to load recipes:', err));
</script>
</body>
</html>
