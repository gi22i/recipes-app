<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Recipes</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap');

:root {
  --bg-dark: #0d0d0d;
  --card-dark: #1a1a1a;
  --text-light: #e0e0e0;
  --accent-light: #f5f5f5;
  --shadow: rgba(255, 255, 255, 0.08);
  --hover-shadow: rgba(255, 255, 255, 0.15);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  background: var(--bg-dark);
  color: var(--text-light);
}

header {
  background: #000;
  color: var(--accent-light);
  padding: 30px 15px;
  text-align: center;
  letter-spacing: 1px;
}

header h1 {
  margin: 0;
  font-weight: 600;
  font-size: 2.4rem;
}

.search-box{
margin-top:18px;
}

.search-box input{
padding:10px;
width:260px;
border-radius:8px;
border:none;
font-size:14px;
}

.grid {
  display: grid;
  gap: 25px;
  padding: 25px;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
}

.card {
  background: linear-gradient(145deg, #1c1c1c, #141414);
  border-radius: 16px;
  padding: 25px;
  cursor: pointer;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  box-shadow: 0 6px 18px var(--shadow);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at center, rgba(255,255,255,0.02), transparent 60%);
  transform: rotate(45deg);
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 14px 28px var(--hover-shadow);
}

.card h3 {
  margin: 0;
  font-size: 1.4rem;
  font-weight: 600;
  text-align: center;
  color: var(--accent-light);
  position: relative;
  padding-top: 10px;
}

.card h3::after {
  content: "";
  display: block;
  width: 50px;
  height: 3px;
  background: var(--accent-light);
  margin: 8px auto 0;
  border-radius: 2px;
}

.card::after {
  content: "🍽️";
  position: absolute;
  top: 15px;
  right: 15px;
  font-size: 1.2rem;
  opacity: 0.15;
  pointer-events: none;
}

.modal-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  display: none;
  background: rgba(0,0,0,0.92);
  justify-content: center;
  align-items: center;
  z-index: 10;
}

.modal {
  background: var(--card-dark);
  color: var(--text-light);
  padding: 35px;
  border-radius: 20px;
  width: 90%;
  max-width: 700px;
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
  box-shadow: 0 12px 35px rgba(0,0,0,0.8);
}

.modal h2 {
  margin-top: 0;
  color: var(--accent-light);
  border-bottom: 1px solid var(--accent-light);
  padding-bottom: 12px;
  font-size: 2rem;
}

.modal .section-title {
  font-weight: 600;
  margin-top: 22px;
  margin-bottom: 8px;
  color: var(--accent-light);
  font-size: 1.1rem;
  letter-spacing: 0.5px;
}

.modal p, .modal li {
  color: var(--text-light);
  line-height: 1.6;
  font-size: 0.95rem;
}

.modal ul, .modal ol {
  padding-left: 20px;
  margin: 0;
}

.close-btn {
  position: absolute;
  top: 18px;
  right: 18px;
  background: var(--accent-light);
  color: #000;
  border: none;
  padding: 8px 14px;
  font-size: 1.1rem;
  cursor: pointer;
  border-radius: 10px;
  font-weight: 600;
}

</style>
</head>

<body>

<header>
<h1>My Recipes</h1>

<div class="search-box">
<input id="search" placeholder="Search recipes...">
</div>

</header>

<div class="grid" id="recipe-grid">
Loading recipes...
</div>

<div class="modal-bg" id="modal-bg">
<div class="modal">
<button class="close-btn" id="close-btn">X</button>
<div id="modal-content"></div>
</div>
</div>

<script>

const jsonURL = 'https://raw.githubusercontent.com/gi22i/recipes-app/refs/heads/main/Recipes.json';

let allRecipes = [];

async function fetchRecipes() {
const response = await fetch(jsonURL + '?cb=' + new Date().getTime());
return await response.json();
}

function renderInstructions(instructions){

if(!instructions) return "<p>N/A</p>";

if(Array.isArray(instructions)){
return `<ol>${instructions.map(step=>`<li>${step}</li>`).join('')}</ol>`;
}

return `<p>${instructions}</p>`;
}

function renderMacros(macros){

if(!macros) return "<p>N/A</p>";

if(typeof macros === "string"){
return `<p>${macros}</p>`;
}

return `
<ul>
<li>Calories: ${macros.calories ?? 'N/A'}</li>
<li>Protein: ${macros.protein ?? 'N/A'} g</li>
<li>Carbs: ${macros.carbs ?? 'N/A'} g</li>
<li>Fat: ${macros.fat ?? 'N/A'} g</li>
<li>Fibre: ${macros.fibre ?? 'N/A'} g</li>
<li>Saturated Fat: ${macros.saturated ?? 'N/A'} g</li>
<li>Monounsaturated Fat: ${macros.mono ?? 'N/A'} g</li>
<li>Polyunsaturated Fat: ${macros.poly ?? 'N/A'} g</li>
</ul>
`;
}

function showModal(recipe){

const html = `
<h2>${recipe.title}</h2>

<div class="section-title">Ingredients</div>
<ul>${recipe.ingredients.map(i=>`<li>${i}</li>`).join('')}</ul>

<div class="section-title">Method</div>
${renderInstructions(recipe.instructions)}

<div class="section-title">Macros</div>
${renderMacros(recipe.macros)}

${recipe.notes ? `<div class="section-title">Notes</div><p>${recipe.notes}</p>` : ''}
`;

document.getElementById('modal-content').innerHTML = html;
document.getElementById('modal-bg').style.display='flex';

}

function renderGrid(recipes){

const grid=document.getElementById('recipe-grid');

grid.innerHTML='';

recipes.forEach(recipe=>{

const card=document.createElement('div');

card.className='card';

card.innerHTML=`<h3>${recipe.title}</h3>`;

card.addEventListener('click',()=>showModal(recipe));

grid.appendChild(card);

});

}

function initGrid(data){

const recipes=data.recipes || data;

allRecipes=recipes;

renderGrid(recipes);

}

document.getElementById('search').addEventListener('input',e=>{

const term=e.target.value.toLowerCase();

const filtered=allRecipes.filter(r=>r.title.toLowerCase().includes(term));

renderGrid(filtered);

});

document.getElementById('close-btn').addEventListener('click',()=>{
document.getElementById('modal-bg').style.display='none';
});

fetchRecipes().then(initGrid);

</script>

</body>
</html>
