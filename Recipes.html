<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Recipes</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; background: #f7f7f7; }
  h1 { text-align: center; }
  .recipe { background: #fff; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
  .recipe h2 { margin-top: 0; color: #333; }
  .ingredients, .instructions, .notes { margin: 5px 0; }
  .ingredients li { margin-bottom: 3px; }
</style>
</head>
<body>
<h1>My Recipes</h1>
<div id="recipe-list">Loading recipes...</div>

<script>
const jsonUrl = 'https://raw.githubusercontent.com/gi22i/recipes-app/refs/heads/main/Recipes.json';

async function loadRecipes() {
  try {
    const response = await fetch(jsonUrl + '?cache-bust=' + new Date().getTime());
    const data = await response.json();

    const list = document.getElementById('recipe-list');
    list.innerHTML = ''; // clear loading text

    data.forEach(recipe => {
      const div = document.createElement('div');
      div.className = 'recipe';
      div.innerHTML = `
        <h2>${recipe.title}</h2>
        <div class="ingredients"><strong>Ingredients:</strong>
          <ul>${recipe.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
        </div>
        <div class="instructions"><strong>Instructions:</strong> ${recipe.instructions}</div>
        ${recipe.notes ? `<div class="notes"><strong>Notes:</strong> ${recipe.notes}</div>` : ''}
      `;
      list.appendChild(div);
    });
  } catch (err) {
    document.getElementById('recipe-list').innerHTML = 'Failed to load recipes.';
    console.error(err);
  }
}

loadRecipes();
</script>
</body>
</html>
