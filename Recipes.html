<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Global Styles */
  body {
    margin: 0;
    font-family: 'Merriweather', serif;
    background: linear-gradient(135deg, #f5f5f5, #d9d9d9);
    background-attachment: fixed;
    color: #222;
    line-height: 1.6;
  }

  h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 3rem;
    text-align: center;
    margin: 2rem 0;
    color: #333;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
  }

  .recipes-container {
    max-width: 1200px;
    margin: auto;
    padding: 1rem;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 2rem;
  }

  .recipe-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    padding: 1.5rem;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .recipe-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 24px rgba(0,0,0,0.15);
  }

  .recipe-title {
    font-weight: 700;
    font-size: 1.5rem;
    margin-bottom: 1rem;
  }

  .accordion {
    background-color: #f1f1f1;
    color: #444;
    cursor: pointer;
    padding: 0.7rem 1rem;
    width: 100%;
    border: none;
    text-align: left;
    outline: none;
    font-size: 1rem;
    border-radius: 6px;
    margin: 0.3rem 0;
    transition: background 0.3s ease;
  }

  .accordion:hover {
    background-color: #ddd;
  }

  .accordion.active {
    background-color: #ccc;
  }

  .panel {
    padding: 0 1rem;
    display: none;
    background-color: white;
    overflow: hidden;
    margin-bottom: 0.5rem;
  }

  .ingredients span.keyword {
    font-weight: bold;
    color: #333;
  }

  .macro-bar {
    display: flex;
    margin: 0.5rem 0;
  }

  .macro-bar div {
    flex: 1;
    height: 10px;
    margin-right: 4px;
    border-radius: 5px;
    transition: width 0.5s ease;
  }

  .protein { background: #4CAF50; }
  .carbs   { background: #FFC107; }
  .fat     { background: #F44336; }

  .macro-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    margin-bottom: 0.5rem;
  }

</style>
</head>
<body>

<h1>My Recipe Collection</h1>
<div class="recipes-container" id="recipesContainer"></div>

<script>
const recipes = [
  {
    "title": "Turkey Burgers",
    "ingredients": ["400g <span class='keyword'>turkey mince</span>", "1 <span class='keyword'>egg</span>", "1½ tsp psyllium husk", "1 tsp soy sauce", "garlic powder", "smoked paprika", "salt", "pepper", "2 burger buns"],
    "instructions": ["Add turkey mince to a bowl.", "Mix in egg, psyllium husk, soy sauce and seasonings.", "Let rest 5 min.", "Form 2 patties.", "Air fry at 190°C for 12 min.", "Toast buns and serve."],
    "macros": {"protein": 60,"carbs":30,"fat":24}
  },
  {
    "title": "Creamy Chicken and Broccoli Pasta",
    "ingredients": ["8 oz high fiber pasta", "1 lb chicken breast", "4 garlic cloves", "1 onion", "4 cup broccoli florets", "½ cup 2% milk", "2½ cup chicken broth", "½ cup Parmesan", "½ tsp red pepper flakes", "½ tsp dried basil", "1 tbsp lemon juice", "salt & pepper"],
    "instructions": ["Season chicken, cook until lightly browned and set aside.", "Cook onion 5 min.", "Add garlic, pasta, 2 cups broth, spices. Simmer 8 min.", "Add broccoli + ½ cup broth, simmer 4 min.", "Add chicken, milk, cheese, lemon, simmer 5 min.", "Let sit 2-3 min and serve."],
    "macros": {"protein":42,"carbs":55,"fat":13}
  }
];

const container = document.getElementById('recipesContainer');

recipes.forEach(recipe => {
  const card = document.createElement('div');
  card.className = 'recipe-card';

  const title = document.createElement('div');
  title.className = 'recipe-title';
  title.innerHTML = recipe.title;
  card.appendChild(title);

  const ingButton = document.createElement('button');
  ingButton.className = 'accordion';
  ingButton.innerText = 'Ingredients';
  card.appendChild(ingButton);

  const ingPanel = document.createElement('div');
  ingPanel.className = 'panel ingredients';
  ingPanel.innerHTML = '<ul><li>' + recipe.ingredients.join('</li><li>') + '</li></ul>';
  card.appendChild(ingPanel);

  const instButton = document.createElement('button');
  instButton.className = 'accordion';
  instButton.innerText = 'Instructions';
  card.appendChild(instButton);

  const instPanel = document.createElement('div');
  instPanel.className = 'panel instructions';
  instPanel.innerHTML = '<ol><li>' + recipe.instructions.join('</li><li>') + '</li></ol>';
  card.appendChild(instPanel);

  const macroLabels = document.createElement('div');
  macroLabels.className = 'macro-labels';
  macroLabels.innerHTML = '<span>Protein</span><span>Carbs</span><span>Fat</span>';
  card.appendChild(macroLabels);

  const macroBar = document.createElement('div');
  macroBar.className = 'macro-bar';
  const total = recipe.macros.protein + recipe.macros.carbs + recipe.macros.fat;
  const proteinWidth = (recipe.macros.protein/total)*100;
  const carbsWidth = (recipe.macros.carbs/total)*100;
  const fatWidth = (recipe.macros.fat/total)*100;
  macroBar.innerHTML = `<div class="protein" style="width:${proteinWidth}%"></div>
                        <div class="carbs" style="width:${carbsWidth}%"></div>
                        <div class="fat" style="width:${fatWidth}%"></div>`;
  card.appendChild(macroBar);

  container.appendChild(card);
});

/* Accordion functionality */
const acc = document.getElementsByClassName("accordion");
for (let i = 0; i < acc.length; i++) {
  acc[i].addEventListener("click", function() {
    this.classList.toggle("active");
    const panel = this.nextElementSibling;
    panel.style.display = (panel.style.display === "block") ? "none" : "block";
  });
}
</script>

</body>
</html>
