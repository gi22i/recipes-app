<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #e0e0e0, #b0b0b0);
    color: #222;
  }
  h1, h2, h3 { font-family: 'Dancing Script', cursive; font-weight: 700; margin:0.5em 0; }
  h1 { font-size: 3em; text-align:center; margin-top:20px; color:#111; }
  h2 { font-size:2em; margin-bottom:0.5em; }
  h3 { font-size:1.5em; }
  .container { width: 90%; max-width:1200px; margin:auto; padding:1em; }
  #searchBar { width:100%; padding:12px 20px; margin-bottom:20px; border:2px solid #444; border-radius:8px; font-size:1em; }
  .tag-container { margin-bottom:20px; text-align:center; }
  .tag { display:inline-block; background:#ccc; padding:5px 12px; margin:5px; border-radius:20px; cursor:pointer; font-weight:600; transition:0.3s; }
  .tag:hover, .tag.active { background:#888; color:#fff; }
  .recipe-card { background:#f7f7f7; border-radius:15px; padding:20px; margin-bottom:20px; box-shadow:0 8px 20px rgba(0,0,0,0.1); transition:transform 0.2s, box-shadow 0.2s; }
  .recipe-card:hover { transform:translateY(-5px); box-shadow:0 12px 30px rgba(0,0,0,0.2); }
  .recipe-title { font-weight:700; margin-bottom:10px; font-size:1.8em; }
  .ingredients, .instructions { margin:10px 0; line-height:1.5; }
  .macros { font-size:0.95em; background:#ddd; padding:8px; border-radius:8px; margin-top:10px; }
  @media (max-width:768px) { .recipe-title { font-size:1.5em; } h1 { font-size:2.2em; } }
</style>
</head>

<h1>My Recipe Collection</h1>
<input type="text" id="searchBar" placeholder="Search recipes...">
<div class="tag-container" id="tagContainer"></div>
<div id="recipeList"></div>
</div>

];

const tagContainer = document.getElementById("tagContainer");
let tags = [];
recipes.forEach(r => r.ingredients.forEach(i => {const tag=i.toLowerCase();if(!tags.includes(tag)) tags.push(tag);}));
tags.sort();
tags.forEach(tag => {
  const span=document.createElement("span");
  span.className="tag";
  span.textContent=tag;
  span.addEventListener("click",()=>{
    span.classList.toggle("active");
    renderRecipes();
  });
  tagContainer.appendChild(span);
});

const recipeList=document.getElementById("recipeList");
function renderRecipes(){
  const searchText=document.getElementById("searchBar").value.toLowerCase();
  const activeTags=Array.from(document.querySelectorAll(".tag.active")).map(t=>t.textContent);
  recipeList.innerHTML="";
  recipes.forEach(recipe=>{
    const inSearch=recipe.title.toLowerCase().includes(searchText) || recipe.ingredients.some(i=>i.toLowerCase().includes(searchText));
    const hasTags=activeTags.every(t=>recipe.ingredients.map(i=>i.toLowerCase()).includes(t));
    if(inSearch && hasTags){
      const div=document.createElement("div");
      div.className="recipe-card";
      div.innerHTML=`<div class="recipe-title">${recipe.title}</div>
      <h3>Ingredients</h3><ul class="ingredients">${recipe.ingredients.map(i=>`<li>${i}</li>`).join('')}</ul>
      <h3>Instructions</h3><ol class="instructions">${recipe.instructions.map(i=>`<li>${i}</li>`).join('')}</ol>
      <div class="macros">Calories: ${recipe.macros.calories} | Protein: ${recipe.macros.protein}g | Carbs: ${recipe.macros.carbs}g | Fat: ${recipe.macros.fat}g | Fibre: ${recipe.macros.fibre}g</div>`;
      recipeList.appendChild(div);
    }
  });
}

document.getElementById("searchBar").addEventListener("input", renderRecipes);
renderRecipes();
</script>
</body>
</html>
