<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RecipeHub">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    
    <title>Recipe Hub</title>

    <style>
        :root {
            --bg: #f2f2f7;
            --card: #ffffff;
            --text-primary: #000000;
            --text-secondary: #8e8e93;
            --accent: #007aff;
            --border: #e5e5ea;
            --box-keto-bg: rgba(0, 122, 255, 0.1);
            --box-heart-bg: rgba(255, 59, 48, 0.1);
            --box-heart-text: #ff3b30;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card: #1c1c1e;
                --text-primary: #ffffff;
                --text-secondary: #8e8e93;
                --accent: #0a84ff;
                --border: #38383a;
                --box-keto-bg: rgba(10, 132, 255, 0.2);
                --box-heart-bg: rgba(255, 69, 58, 0.2);
                --box-heart-text: #ff453a;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            margin: 0;
            padding: env(safe-area-inset-top) 0 40px 0;
            transition: background 0.3s ease;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            height: 60px;
        }

        .header-icon {
            height: 100%;
            max-width: 60px;
            object-fit: contain;
            padding: 5px;
        }

        header h1 {
            flex-grow: 1;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .controls {
            padding: 0 15px 20px 15px;
        }

        #searchBar {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: var(--card);
            color: var(--text-primary);
            font-size: 17px;
            margin-bottom: 15px;
            box-sizing: border-box;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .filter-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            -webkit-overflow-scrolling: touch;
        }

        .filter-btn {
            background: var(--card);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        .filter-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .grid {
            padding: 0 15px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 12px 0;
            text-align: left;
        }

        .indicator-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .indicator-box {
            flex: 1;
            padding: 8px;
            border-radius: 10px;
            text-align: center;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid var(--border);
        }

        .ind-keto { background: var(--box-keto-bg); color: var(--accent); border: none; }
        .ind-heart { background: var(--box-heart-bg); color: var(--box-heart-text); border: none; }
        .ind-none { color: var(--text-secondary); opacity: 0.4; }

        .macro-section {
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        .kcal-display {
            display: block;
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .macro-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .macro-group {
            margin-bottom: 10px;
        }

        .macro-label {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 700;
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }

        .macro-value {
            font-size: 16px;
            font-weight: 700;
        }

        .breakdown-box {
            margin-top: 5px;
            padding-left: 8px;
            border-left: 2px solid var(--border);
        }

        .breakdown-item {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .fat-breakdown-grid {
            grid-column: span 2;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 5px;
            border-top: 1px solid var(--border);
            padding-top: 8px;
        }
    </style>
</head>
<body>

    <header>
        <img src="left_icon.png" class="header-icon" alt="">
        <h1>Recipes</h1>
        <img src="right_icon.png" class="header-icon" alt="">
    </header>

    <div class="controls">
        <input type="text" id="searchBar" placeholder="Search recipe name..." onkeyup="filterData()">
        
        <div class="filter-row">
            <button class="filter-btn active" onclick="setTag('all', this)">All</button>
            <button class="filter-btn" onclick="setTag('Keto', this)">Keto</button>
            <button class="filter-btn" onclick="setTag('Heart', this)">Heart</button>
            <button class="filter-btn" onclick="setTag('Low Sugar', this)">Low Sugar</button>
        </div>
    </div>

    <div id="recipeGrid" class="grid"></div>

    <script>
        let recipeData = [];
        let activeFilter = 'all';

        async function fetchRecipes() {
            try {
                const response = await fetch('recipes.json');
                const json = await response.json();
                recipeData = json.recipes;
                render(recipeData);
            } catch (err) {
                console.error("Error: Ensure recipes.json is in the same folder.");
            }
        }

        function setTag(tag, el) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            activeFilter = tag;
            filterData();
        }

        function filterData() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const filtered = recipeData.filter(r => {
                const nameMatch = r.title.toLowerCase().includes(query);
                const tagMatch = (activeFilter === 'all' || (r.designations && r.designations.includes(activeFilter)));
                return nameMatch && tagMatch;
            });
            render(filtered);
        }

        function render(list) {
            const grid = document.getElementById('recipeGrid');
            grid.innerHTML = '';

            list.forEach(r => {
                const m = r.macrosPerPortion;
                const designations = r.designations || [];
                const isKeto = designations.includes('Keto');
                const isHeart = designations.includes('Heart');

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="kcal-display">${m.calories} KCAL</span>
                    <h2 class="card-title">${r.title}</h2>
                    
                    <div class="indicator-row">
                        <div class="indicator-box ${isKeto ? 'ind-keto' : 'ind-none'}">${isKeto ? 'Keto Friendly' : 'Standard'}</div>
                        <div class="indicator-box ${isHeart ? 'ind-heart' : 'ind-none'}">${isHeart ? '♥ Heart Healthy' : 'General'}</div>
                    </div>

                    <div class="macro-section">
                        <div class="macro-grid">
                            <div class="macro-group">
                                <span class="macro-label">Protein</span>
                                <span class="macro-value">${m.protein}g</span>
                            </div>
                            <div class="macro-group">
                                <span class="macro-label">Carbs (Net)</span>
                                <span class="macro-value">${m.carbs_net}g</span>
                                <div class="breakdown-box">
                                    <div class="breakdown-item"><span>Fiber</span> <span>${m.fiber}g</span></div>
                                    <div class="breakdown-item"><span>Sugars</span> <span>${m.sugar}g</span></div>
                                    <div class="breakdown-item"><span>Polyols</span> <span>${m.sugar_alcohols}g</span></div>
                                </div>
                            </div>
                            <div class="macro-group" style="grid-column: span 2;">
                                <span class="macro-label">Total Fat</span>
                                <span class="macro-value">${m.fat}g</span>
                                <div class="fat-breakdown-grid">
                                    <div class="breakdown-item" style="flex-direction:column; align-items:flex-start;">
                                        <span style="font-size:9px">Saturated</span><strong>${m.fat_sat}g</strong>
                                    </div>
                                    <div class="breakdown-item" style="flex-direction:column; align-items:flex-start;">
                                        <span style="font-size:9px">Monosat.</span><strong>${m.fat_mono}g</strong>
                                    </div>
                                    <div class="breakdown-item" style="flex-direction:column; align-items:flex-start;">
                                        <span style="font-size:9px">Polysat.</span><strong>${m.fat_poly}g</strong>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.onload = fetchRecipes;
    </script>
</body>
</html>
