<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipes</title>

<style>
body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
  background:#000;
  color:#fff;
}

.header{
  text-align:center;
  padding:20px 10px 10px;
  font-size:24px;
  font-weight:600;
}

.search-bar{
  width:90%;
  margin:10px auto;
  display:block;
  padding:12px;
  border-radius:12px;
  border:none;
  outline:none;
  font-size:16px;
  background:#111;
  color:#fff;
}

.section-title{
  padding:10px 16px 0;
  font-size:18px;
  font-weight:600;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:12px;
}

.card{
  position:relative;
  background:linear-gradient(145deg,#111,#1a1a1a);
  border-radius:18px;
  padding:14px;
  box-shadow:0 6px 20px rgba(0,0,0,0.6);
  cursor:pointer;
}

.card-title{
  text-align:center;
  font-size:16px;
  font-weight:600;
  margin-bottom:6px;
}

.macros{
  text-align:center;
  font-size:12px;
  opacity:0.8;
}

.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  display:none;
  overflow-y:auto;
  padding:20px;
}

.close-btn{
  position:fixed;
  top:15px;
  right:20px;
  font-size:24px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">Recipes</div>

<input type="text" class="search-bar" placeholder="Search recipes..." onkeyup="searchRecipes()">

<div id="recipes"></div>

<div id="popup" class="popup">
  <div class="close-btn" onclick="closePopup()">✕</div>
  <div id="popup-content"></div>
</div>

<script>

const recipes = [
  {
    "title": "Turkey Burgers",
    "category": "Meals",
    "ingredients": ["400g turkey mince","1 egg","psyllium husk","soy sauce","spices","burger buns"],
    "instructions": ["Mix ingredients","Form patties","Cook in air fryer","Serve in buns"],
    "macrosPerPortion": {"calories":310,"protein":30,"carbs":15,"fat":12}
  },
  {
    "title": "Mediterranean Chicken Bake",
    "category": "Meals",
    "ingredients": ["chicken","vegetables","mozzarella","olive oil"],
    "instructions": ["Add to dish","Bake 25 min","Add cheese","Bake 5 min"],
    "macrosPerPortion": {"calories":371,"protein":50.5,"carbs":10,"fat":10.5}
  },
  {
    "title": "Veggie Burger",
    "category": "Meals",
    "ingredients": ["vegetables","egg","breadcrumbs"],
    "instructions": ["Cook veg","Mix","Form patties","Bake"],
    "macrosPerPortion": {"calories":145,"protein":6,"carbs":15,"fat":4}
  },
  {
    "title": "Creamy Chicken and Broccoli Pasta",
    "category": "Meals",
    "ingredients": ["chicken","broccoli","pasta","skyr"],
    "instructions": ["Cook ingredients","Mix together"],
    "macrosPerPortion": {"calories":450,"protein":45,"carbs":50,"fat":10}
  },
  {
    "title": "Fillet Steak with Potatoes",
    "category": "Meals",
    "ingredients": ["steak","potatoes","olive oil"],
    "instructions": ["Cook potatoes","Cook steak","Rest and serve"],
    "macrosPerPortion": {"calories":450,"protein":40,"carbs":45,"fat":12.5}
  },

  {
    "title": "Heart Healthy Bean Oat Cake",
    "category": "Heart-Healthy Desserts",
    "ingredients": ["cannellini beans","oat flour","eggs","cocoa","honey","dark chocolate"],
    "instructions": ["Blend beans","Mix ingredients","Fold chocolate","Bake at 180°C"],
    "macrosPerPortion": {"calories":138,"protein":4.4,"carbs":17.5,"fat":4}
  },

  {
    "title": "Banana Cocoa Cake",
    "category": "Heart-Healthy Desserts",
    "ingredients": ["bananas","oats","cocoa","eggs"],
    "instructions": ["Mix","Bake"],
    "macrosPerPortion": {"calories":150,"protein":5,"carbs":22,"fat":4}
  }
];

function displayRecipes(data){

  const container = document.getElementById("recipes");
  container.innerHTML = "";

  let categories = {};

  data.forEach(r => {
    if(!categories[r.category]) categories[r.category] = [];
    categories[r.category].push(r);
  });

  for(let category in categories){

    container.innerHTML += `<div class="section-title">${category}</div>`;

    let grid = document.createElement("div");
    grid.className = "grid";

    categories[category].forEach(r => {

      let card = document.createElement("div");
      card.className = "card";

      card.onclick = () => openPopup(r);

      card.innerHTML = `
        <div class="card-title">${r.title}</div>
        <div class="macros">
          ${r.macrosPerPortion.calories} kcal • 
          P ${r.macrosPerPortion.protein}g • 
          C ${r.macrosPerPortion.carbs}g • 
          F ${r.macrosPerPortion.fat}g
        </div>
      `;

      grid.appendChild(card);

    });

    container.appendChild(grid);
  }
}

function openPopup(recipe){

  const popup = document.getElementById("popup");
  const content = document.getElementById("popup-content");

  content.innerHTML = `
    <h2>${recipe.title}</h2>

    <h3>Ingredients</h3>
    <ul>${recipe.ingredients.map(i => `<li>${i}</li>`).join("")}</ul>

    <h3>Instructions</h3>
    <ol>${recipe.instructions.map(i => `<li>${i}</li>`).join("")}</ol>

    <h3>Macros</h3>
    <p>
      ${recipe.macrosPerPortion.calories} kcal<br>
      Protein: ${recipe.macrosPerPortion.protein}g<br>
      Carbs: ${recipe.macrosPerPortion.carbs}g<br>
      Fat: ${recipe.macrosPerPortion.fat}g
    </p>
  `;

  popup.style.display = "block";
}

function closePopup(){
  document.getElementById("popup").style.display = "none";
}

function searchRecipes(){
  const value = document.querySelector(".search-bar").value.toLowerCase();

  let filtered = recipes.filter(r =>
    r.title.toLowerCase().includes(value)
  );

  displayRecipes(filtered);
}

displayRecipes(recipes);

</script>

</body>
</html>
