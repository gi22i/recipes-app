<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Recipe Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --accent: #f5f5dc; /* Cream color from illustration */
            --text-main: #e0e0e0;
            --text-dim: #999;
            --border: 1px solid #2a2a2a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Lora', serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            max-width: 800px;
            width: 100%;
            margin-bottom: 60px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 30px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 8vw, 3.5rem);
            color: var(--accent);
            margin: 0;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            font-style: italic;
            color: var(--text-dim);
            margin-top: 10px;
            letter-spacing: 2px;
        }

        #app-container {
            width: 100%;
            max-width: 1100px;
        }

        .category-section {
            margin-bottom: 60px;
        }

        .category-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--accent);
            border-left: 4px solid var(--accent);
            padding-left: 20px;
            margin-bottom: 30px;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .recipe-card {
            background: var(--card-bg);
            border: var(--border);
            padding: 30px;
            position: relative;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .recipe-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
        }

        /* Decorative Book Corner */
        .recipe-card::after {
            content: '❧';
            position: absolute;
            bottom: 15px;
            right: 20px;
            color: var(--accent);
            opacity: 0.5;
            font-size: 1.5rem;
        }

        h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            margin: 0 0 15px 0;
            color: var(--accent);
            line-height: 1.2;
        }

        .ingredients {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .instructions {
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .macros {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding-top: 20px;
            border-top: 1px solid #2a2a2a;
            font-size: 0.85rem;
        }

        .macro-item span {
            color: var(--accent);
            font-weight: bold;
        }

        footer {
            margin-top: 80px;
            color: var(--text-dim);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        @media (max-width: 600px) {
            body { padding: 20px 15px; }
            .recipe-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>The Archive</h1>
        <div class="subtitle">A Digital Grimoire of Recipes</div>
    </header>

    <main id="app-container">
        </main>

    <footer>
        &mdash; Organized Digitally 2026 &mdash;
    </footer>

    <script>
        async function loadRecipes() {
            try {
                const response = await fetch('recipes.json');
                if (!response.ok) throw new Error('Failed to load JSON');
                const data = await response.json();
                render(data.recipes);
            } catch (err) {
                document.getElementById('app-container').innerHTML = 
                    `<p style="color: var(--accent); text-align: center;">Error opening the archive: ${err.message}</p>`;
            }
        }

        function render(recipes) {
            const container = document.getElementById('app-container');
            const categories = [...new Set(recipes.map(r => r.category))];

            container.innerHTML = categories.map(cat => `
                <section class="category-section">
                    <h2 class="category-title">${cat}</h2>
                    <div class="recipe-grid">
                        ${recipes.filter(r => r.category === cat).map(recipe => `
                            <article class="recipe-card">
                                <h3>${recipe.title}</h3>
                                <p class="ingredients"><strong>Requires:</strong> ${recipe.ingredients.replace(/\n/g, ', ')}</p>
                                <div class="instructions">${recipe.instructions.replace(/\n/g, '<br>')}</div>
                                <div class="macros">
                                    <div class="macro-item">P: <span>${recipe.macros.protein}g</span></div>
                                    <div class="macro-item">F: <span>${recipe.macros.fat}g</span></div>
                                    <div class="macro-item">C: <span>${recipe.macros.carbs}g</span></div>
                                    <div class="macro-item"><span>${recipe.macros.kcal} kcal</span></div>
                                </div>
                            </article>
                        `).join('')}
                    </div>
                </section>
            `).join('');
        }

        window.addEventListener('DOMContentLoaded', loadRecipes);
    </script>
</body>
</html>
