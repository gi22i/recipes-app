<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Recipe Manager Pro</title>
    <style>
        :root { --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --accent: #007aff; --border: #d1d1d6; --badge: #000000; --badge-txt: #ffffff; }
        @media (prefers-color-scheme: dark) { :root { --bg: #000000; --card: #1c1c1e; --text: #ffffff; --accent: #0a84ff; --border: #38383a; --badge: #ffffff; --badge-txt: #000000; } }
        
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .sticky-header { position: sticky; top: 0; background: var(--bg); z-index: 100; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        #searchBar { width: 100%; padding: 15px; margin: 10px 0; box-sizing: border-box; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); font-size: 16px; }
        
        .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding: 5px 0; scrollbar-width: none; }
        .filter-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 11px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .category-header { font-size: 20px; font-weight: 800; margin: 25px 0 10px; text-transform: uppercase; color: var(--accent); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .recipe-card { background: var(--card); padding: 15px; border: 1px solid var(--border); border-radius: 12px; text-align: center; cursor: pointer; }
        .recipe-card h3 { margin: 0 0 8px; font-size: 14px; min-height: 2.5em; display: flex; align-items: center; justify-content: center; line-height: 1.2; }
        
        .badge-container { display: flex; justify-content: center; gap: 4px; margin-bottom: 8px; }
        .badge { width: 18px; height: 18px; border-radius: 50%; background: var(--badge); color: var(--badge-txt); font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; }

        #recipePopup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: none; z-index: 1000; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .modal-nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        .close-btn { padding: 8px 20px; background: #ff3b30; color: white; border: none; font-weight: bold; border-radius: 20px; cursor: pointer; }

        .macro-wrapper { display: flex; gap: 10px; margin-bottom: 20px; }
        .macro-box { flex: 1; background: var(--card); border: 1px solid var(--border); padding: 10px; border-radius: 10px; }
        .macro-box h4 { margin: 0 0 8px; font-size: 9px; text-align: center; color: var(--accent); text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
        .m-row { display: flex; justify-content: space-between; font-size: 10px; padding: 4px 0; border-bottom: 1px solid var(--border); }
        
        .info-section { background: var(--card); padding: 15px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 15px; }
        .section-h { font-weight: bold; text-transform: uppercase; margin-bottom: 10px; display: block; color: var(--accent); font-size: 11px; }
        .content-body { font-size: 14px; line-height: 1.5; white-space: pre-line; }
    </style>
</head>
<body>
    <div class="sticky-header">
        <input type="text" id="searchBar" placeholder="Search 54 Recipes..." oninput="render()">
        <div class="filter-bar">
            <button class="filter-btn active" onclick="setFilter('All', this)">All</button>
            <button class="filter-btn" onclick="setFilter('Keto', this)">Keto (K)</button>
            <button class="filter-btn" onclick="setFilter('Heart', this)">Heart (♥)</button>
            <button class="filter-btn" onclick="setFilter('Sugar', this)">Low Sugar (S)</button>
        </div>
    </div>
    <div id="content"></div>
    <div id="recipePopup">
        <div class="modal-nav"><h2 id="popTitle" style="margin:0; font-size: 18px;"></h2><button class="close-btn" onclick="closePopup()">CLOSE</button></div>
        <div class="macro-wrapper">
            <div class="macro-box"><h4>Per Portion</h4><div id="macrosPortion"></div></div>
            <div class="macro-box"><h4>Total Dish</h4><div id="macrosTotal"></div></div>
        </div>
        <div class="info-section"><span class="section-h">Ingredients</span><div id="popIngredients" class="content-body"></div></div>
        <div class="info-section"><span class="section-h">Method</span><div id="popInstructions" class="content-body"></div></div>
    </div>
    <script>
        let recipes = [];
        let currentFilter = 'All';

        async function load() {
            const res = await fetch('recipes.json');
            const data = await res.json();
            recipes = data.recipes;
            render();
        }

        function setFilter(f, b) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            b.classList.add('active');
            render();
        }

        function render() {
            const div = document.getElementById('content');
            const term = document.getElementById('searchBar').value.toLowerCase();
            div.innerHTML = '';

            ["Breakfasts", "Meals", "Bakery", "Desserts"].forEach(cat => {
                const list = recipes.filter(r => {
                    if (r.category !== cat || !r.title.toLowerCase().includes(term)) return false;
                    if (currentFilter === 'Keto' && r.macros.carbs > 10) return false;
                    if (currentFilter === 'Heart' && r.macros.fat_sat > 3) return false;
                    if (currentFilter === 'Sugar' && r.macros.sugar > 5) return false;
                    return true;
                });

                if (list.length > 0) {
                    div.innerHTML += `<div class="category-header">${cat}</div>`;
                    const grid = document.createElement('div'); grid.className = 'grid';
                    list.forEach(r => {
                        const card = document.createElement('div');
                        card.className = 'recipe-card';
                        card.onclick = () => openPopup(r);
                        card.innerHTML = `<div class="badge-container">
                            ${r.macros.carbs <= 10 ? '<div class="badge">K</div>' : ''}
                            ${r.macros.fat_sat <= 3 ? '<div class="badge">♥</div>' : ''}
                            ${r.macros.sugar <= 5 ? '<div class="badge">S</div>' : ''}
                        </div><h3>${r.title}</h3><b>${r.macros.kcal} kcal</b>`;
                        grid.appendChild(card);
                    });
                    div.appendChild(grid);
                }
            });
        }

        function openPopup(r) {
            document.getElementById('popTitle').innerText = r.title;
            document.getElementById('popIngredients').innerText = r.ingredients;
            document.getElementById('popInstructions').innerText = r.instructions;
            document.getElementById('macrosPortion').innerHTML = buildMacros(r.macros, 1);
            document.getElementById('macrosTotal').innerHTML = buildMacros(r.macros, r.portions);
            document.getElementById('recipePopup').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closePopup() { document.getElementById('recipePopup').style.display = 'none'; document.body.style.overflow = 'auto'; }

        function buildMacros(m, mult) {
            const keys = [['kcal','kcal'],['fat','g'],['fat_sat','g'],['fat_poly','g'],['fat_mono','g'],['carbs','g'],['sugar','g'],['polyols','g'],['protein','g'],['fiber','g'],['salt','g']];
            return keys.map(k => `<div class="m-row"><span>${k[0].toUpperCase().replace('_',' ')}</span><span>${(m[k[0]] * mult).toFixed(1)}${k[1]}</span></div>`).join('');
        }
        window.onload = load;
    </script>
</body>
</html>
