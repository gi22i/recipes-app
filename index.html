<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Archive - Recipe Book</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #1a1a1a;
            --accent: #f5f5dc; /* Off-white/Cream from your image */
            --text-main: #e0e0e0;
            --text-dim: #b0b0b0;
            --border-style: 2px solid var(--accent);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Lora', serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: var(--border-style);
            padding-bottom: 20px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--accent);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .category-section {
            width: 100%;
            max-width: 1000px;
            margin-bottom: 50px;
        }

        .category-title {
            font-family: 'Playfair Display', serif;
            color: var(--accent);
            font-size: 2rem;
            border-left: 4px solid var(--accent);
            padding-left: 15px;
            margin-bottom: 25px;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .recipe-card {
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 20px;
            position: relative;
            transition: transform 0.3s ease;
        }

        .recipe-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        /* Decorative corners similar to your image */
        .recipe-card::before {
            content: '❧';
            position: absolute;
            top: 5px;
            right: 10px;
            color: var(--accent);
            font-size: 1.2rem;
        }

        h3 {
            margin-top: 0;
            color: var(--accent);
            font-family: 'Playfair Display', serif;
        }

        .macros {
            font-size: 0.85rem;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            color: var(--text-dim);
            border-top: 1px solid #333;
            padding-top: 10px;
            margin-top: 15px;
        }

        .macro-item span {
            color: var(--accent);
            font-weight: bold;
        }

        .ingredients {
            font-style: italic;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .instructions {
            font-size: 0.9rem;
            line-height: 1.4;
        }

        footer {
            margin-top: 50px;
            color: var(--text-dim);
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <header>
        <h1>The Recipe Archive</h1>
        <p>A Curated Collection of Culinary Arts</p>
    </header>

    <div id="app-container"></div>

    <footer>
        &mdash; EST. 2026 &mdash;
    </footer>

    <script>
        const recipeData = {
            "recipes": [
                { "title": "Smoked Mackerel Avocado Mash", "category": "Breakfasts", "portions": 2, "portion_size": "150g", "ingredients": "1 Smoked Mackerel fillet\n1 ripe Avocado\n1 tbsp Lemon juice\nBlack pepper\nFresh Dill", "instructions": "1. Flake mackerel. 2. Mash avocado. 3. Mix with lemon and pepper.", "macros": { "kcal": 245, "fat": 19.0, "protein": 14.0, "carbs": 4.0 } },
                { "title": "Herb-Crusted Baked Cod", "category": "Meals", "portions": 2, "portion_size": "1 Fillet", "ingredients": "2 Cod Fillets\n30g Almond Flour\nParsley\nLemon", "instructions": "1. Coat fish in flour/herbs. 2. Bake at 200C for 15 mins.", "macros": { "kcal": 310, "fat": 18.0, "protein": 32.0, "carbs": 4.0 } },
                { "title": "Golden Flax Seed Bread", "category": "Bakery", "portions": 10, "portion_size": "1 Slice", "ingredients": "200g Flaxseed\n5 Eggs\n100ml Water", "instructions": "1. Mix and bake in loaf tin at 180C for 45 mins.", "macros": { "kcal": 165, "fat": 13.0, "protein": 7.0, "carbs": 1.5 } },
                { "title": "Avocado Chocolate Mousse", "category": "Desserts", "portions": 2, "portion_size": "1 Bowl", "ingredients": "1 Avocado\n20g Cocoa\nSyrup", "instructions": "1. Blend all until smooth. 2. Chill.", "macros": { "kcal": 160, "fat": 14.0, "protein": 3.0, "carbs": 8.0 } }
                // Additional recipes from your JSON would be mapped here
            ]
        };

        // Note: For a live app, you would use: fetch('recipes.json').then(res => res.json()).then(data => render(data));
        
        function renderRecipes(data) {
            const container = document.getElementById('app-container');
            const categories = [...new Set(data.recipes.map(r => r.category))];

            categories.forEach(cat => {
                const section = document.createElement('section');
                section.className = 'category-section';
                
                const title = document.createElement('h2');
                title.className = 'category-title';
                title.innerText = cat;
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'recipe-grid';

                const catRecipes = data.recipes.filter(r => r.category === cat);
                catRecipes.forEach(recipe => {
                    const card = document.createElement('div');
                    card.className = 'recipe-card';
                    card.innerHTML = `
                        <h3>${recipe.title}</h3>
                        <div class="ingredients">${recipe.ingredients.replace(/\n/g, ', ')}</div>
                        <div class="instructions">${recipe.instructions}</div>
                        <div class="macros">
                            <div class="macro-item">P: <span>${recipe.macros.protein}g</span></div>
                            <div class="macro-item">F: <span>${recipe.macros.fat}g</span></div>
                            <div class="macro-item">C: <span>${recipe.macros.carbs}g</span></div>
                            <div class="macro-item"><span>${recipe.macros.kcal} kcal</span></div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        // Initialize with the data provided in the prompt
        renderRecipes(recipeData);
    </script>
</body>
</html>
