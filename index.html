<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Recipe Archive</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --accent: #f5f5dc;
            --card: #141414;
        }
        body { background: var(--bg); color: #e0e0e0; font-family: serif; padding: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: var(--card); padding: 20px; border: 1px solid #2a2a2a; cursor: pointer; }
        .card:hover { border-color: var(--accent); }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .modal-content { background: #0f0f0f; border: 1px solid var(--accent); padding: 40px; max-width: 800px; max-height: 90vh; overflow-y: auto; }
        .macro-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .macro-table th, .macro-table td { border: 1px solid #333; padding: 10px; text-align: left; font-size: 0.9rem; }
        .close { float: right; cursor: pointer; color: var(--accent); font-size: 2rem; }
    </style>
</head>
<body>

    <h1>The Archive</h1>
    <div id="app" class="grid"></div>

    <div id="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        let recipes = [];

        async function load() {
            const res = await fetch('recipes.json');
            const data = await res.json();
            recipes = data.recipes;
            render();
        }

        function render() {
            document.getElementById('app').innerHTML = recipes.map(r => `
                <div class="card" onclick="openRecipe('${r.title}')">
                    <h3>${r.title}</h3>
                    <p>${r.portions} Portions</p>
                </div>
            `).join('');
        }

        function openRecipe(title) {
            const r = recipes.find(rec => rec.title === title);
            const m = r.macros_per_portion;
            const t = r.macros_total;
            
            document.getElementById('modal-body').innerHTML = `
                <h2>${r.title}</h2>
                <p><i>${r.portions} Portions</i></p>
                <h4>Nutrition Table</h4>
                <table class="macro-table">
                    <thead>
                        <tr>
                            <th>Macro</th>
                            <th>Per Portion</th>
                            <th>Total Batch</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>Calories</td><td>${m.kcal} kcal</td><td>${t.kcal} kcal</td></tr>
                        <tr><td>Fat</td><td>${m.fat}g</td><td>${t.fat}g</td></tr>
                        <tr><td>&nbsp;&nbsp;<i>of which saturates</i></td><td>${m.fat_saturates}g</td><td>${t.fat_saturates}g</td></tr>
                        <tr><td>&nbsp;&nbsp;<i>of which unsaturates</i></td><td>${m.fat_unsaturates}g</td><td>${t.fat_unsaturates}g</td></tr>
                        <tr><td>Carbohydrates</td><td>${m.carbs}g</td><td>${t.carbs}g</td></tr>
                        <tr><td>&nbsp;&nbsp;<i>of which sugars</i></td><td>${m.sugar}g</td><td>${t.sugar}g</td></tr>
                        <tr><td>Fibre</td><td>${m.fiber}g</td><td>${t.fiber}g</td></tr>
                        <tr><td>Protein</td><td>${m.protein}g</td><td>${t.protein}g</td></tr>
                    </tbody>
                </table>
                <br>
                <h4>Instructions</h4>
                <p>${r.instructions.replace(/\n/g, '<br>')}</p>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        window.onload = load;
    </script>
</body>
</html>
