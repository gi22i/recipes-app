<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>Recipes</title>
<style>
  body { margin: 0; font-family: -apple-system, system-ui; background: #000; color: #fff; -webkit-tap-highlight-color: transparent; }
  .header { text-align: center; padding: 25px 10px 10px; font-size: 18px; font-weight: 600; }
  
  .search-container { padding: 0 16px 15px; }
  .search-bar { 
    width: 100%; padding: 10px; border-radius: 8px; border: none; 
    background: #1c1c1e; color: #8e8e93; font-size: 14px; box-sizing: border-box;
  }

  .section-title { padding: 15px 16px 5px; font-size: 18px; font-weight: 700; color: #fff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 16px; }
  
  /* Matches the second screenshot: Darker background, centered text */
  .card {
    background: #111111;
    border-radius: 14px;
    padding: 18px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80px;
    position: relative;
  }
  .card:active { background: #1c1c1e; }
  
  .card-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 6px;
    text-align: center;
    width: 100%;
  }
  .card-macros {
    font-size: 11px;
    color: #8e8e93;
    text-align: center;
    line-height: 1.4;
  }

  .heart-icon { position: absolute; top: 12px; left: 10px; font-size: 14px; }
  .watermark { position: absolute; top: 12px; right: 10px; font-size: 16px; opacity: 0.1; }

  /* Popup Styles */
  .popup {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #000; display: none; overflow-y: auto; z-index: 1000;
  }
  .popup-inner { padding: 40px 20px; max-width: 500px; margin: 0 auto; }
  .close-btn { position: fixed; top: 15px; right: 20px; font-size: 30px; cursor: pointer; z-index: 1001; }
  
  .recipe-detail h1 { text-align: center; font-size: 22px; margin-bottom: 20px; }
  .recipe-detail h3 { border-bottom: 1px solid #222; padding-bottom: 8px; margin-top: 25px; }
  .recipe-detail ul, .recipe-detail ol { padding-left: 20px; color: #ccc; }
  .recipe-detail li { margin-bottom: 10px; font-size: 15px; }
</style>
</head>
<body>

<div class="header">Recipes</div>
<div class="search-container">
  <input type="text" id="searchInput" class="search-bar" placeholder="Search recipes..." onkeyup="search()">
</div>

<div id="recipe-list"></div>

<div id="popup" class="popup">
  <span class="close-btn" onclick="closePopup()">✕</span>
  <div id="popup-content" class="popup-inner"></div>
</div>

<script>
let allRecipes = [];

async function init() {
  try {
    const res = await fetch('recipes.json');
    allRecipes = await res.json();
    render(allRecipes);
  } catch (e) { console.error("Load failed"); }
}

function render(data) {
  const container = document.getElementById('recipe-list');
  container.innerHTML = '';
  
  // Custom category order to match your screenshot
  const order = ["Meals", "Bakery", "Desserts", "Heart-Healthy Desserts"];
  const existingCats = [...new Set(data.map(r => r.category))];
  const sortedCats = order.filter(cat => existingCats.includes(cat));

  sortedCats.forEach(cat => {
    const section = document.createElement('div');
    section.innerHTML = `<div class="section-title">${cat}</div>`;
    
    const grid = document.createElement('div');
    grid.className = 'grid';
    
    data.filter(r => r.category === cat).forEach(r => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openPopup(r);
      
      const isHeart = cat.includes("Heart-Healthy") ? '<span class="heart-icon">❤️</span>' : '';
      
      card.innerHTML = `
        ${isHeart}
        <div class="watermark">🍽️</div>
        <div class="card-title">${r.title}</div>
        <div class="card-macros">
          ${r.macrosPerPortion.calories} kcal • P ${r.macrosPerPortion.protein}g • C ${r.macrosPerPortion.carbs}g • F ${r.macrosPerPortion.fat}g
        </div>
      `;
      grid.appendChild(card);
    });
    section.appendChild(grid);
    container.appendChild(section);
  });
}

function openPopup(r) {
  const content = document.getElementById('popup-content');
  content.innerHTML = `
    <div class="recipe-detail">
      <h1>${r.title}</h1>
      <p style="text-align:center; color:#8e8e93;">Portions: ${r.portions} | ${r.macrosPerPortion.calories} kcal per portion</p>
      <h3>Ingredients</h3>
      <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
      <h3>Method</h3>
      <ol>${r.instructions.map(s => `<li>${s}</li>`).join('')}</ol>
    </div>
  `;
  document.getElementById('popup').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function closePopup() {
  document.getElementById('popup').style.display = 'none';
  document.body.style.overflow = 'auto';
}

function search() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const f = allRecipes.filter(r => r.title.toLowerCase().includes(q) || r.category.toLowerCase().includes(q));
  render(f);
}

init();
</script>
</body>
</html>
