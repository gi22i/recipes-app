<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>Recipes</title>
<style>
  body { 
    margin: 0; 
    font-family: -apple-system, system-ui, sans-serif; 
    background: #000; 
    color: #fff; 
    -webkit-tap-highlight-color: transparent; 
  }
  .header { text-align: center; padding: 25px 10px 10px; font-size: 20px; font-weight: 600; }
  
  /* Matches the first image search bar */
  .search-container { padding: 0 16px 15px; }
  .search-bar { 
    width: 100%; padding: 12px; border-radius: 6px; border: none; 
    background: #fff; color: #8e8e93; font-size: 16px; box-sizing: border-box;
  }

  .section-title { padding: 20px 16px 5px; font-size: 18px; font-weight: 700; color: #fff; }
  
  /* 2-column uniform grid */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 16px 20px; }
  
  /* Matching the exact dimensions and look of the cards in Image 1 */
  .card {
    background: #2c2c2e;
    border-radius: 12px;
    padding: 20px 15px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    aspect-ratio: 1.3 / 1;
    box-sizing: border-box;
    position: relative;
  }
  
  .card-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
    text-align: left;
    display: inline-block;
    border-bottom: 2px solid #fff; /* The white underline from image 1 */
    padding-bottom: 4px;
    align-self: flex-start;
    line-height: 1.2;
  }
  
  .card-macros {
    font-size: 11px;
    color: #fff;
    opacity: 0.9;
    text-align: left;
    margin-top: 8px;
    white-space: nowrap;
  }

  /* The subtle icon in the top left corner */
  .watermark-icon {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 18px;
    opacity: 0.15;
  }

  /* Popup Styles */
  .popup {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #000; display: none; overflow-y: auto; z-index: 1000;
  }
  .popup-inner { padding: 40px 20px; max-width: 600px; margin: 0 auto; }
  .close-btn { position: fixed; top: 15px; right: 20px; font-size: 32px; cursor: pointer; z-index: 1001; }
  
  .recipe-detail h1 { font-size: 26px; margin-bottom: 10px; border-bottom: 2px solid #fff; display: inline-block; }
  .recipe-detail h3 { border-bottom: 1px solid #333; padding-bottom: 8px; margin-top: 25px; }
  .recipe-detail ul, .recipe-detail ol { padding-left: 20px; color: #ddd; }
  .recipe-detail li { margin-bottom: 12px; font-size: 16px; }
</style>
</head>
<body>

<div class="header">Recipes</div>
<div class="search-container">
  <input type="text" id="searchInput" class="search-bar" placeholder="Search recipes..." onkeyup="search()">
</div>

<div id="recipe-list"></div>

<div id="popup" class="popup">
  <span class="close-btn" onclick="closePopup()">✕</span>
  <div id="popup-content" class="popup-inner"></div>
</div>

<script>
let allRecipes = [];

async function init() {
  try {
    const res = await fetch('recipes.json');
    allRecipes = await res.json();
    render(allRecipes);
  } catch (e) { console.error("Data load failed"); }
}

function render(data) {
  const container = document.getElementById('recipe-list');
  container.innerHTML = '';
  
  const order = ["Meals", "Bakery", "Desserts", "Heart-Healthy Desserts"];
  const existingCats = [...new Set(data.map(r => r.category))];
  const sortedCats = order.filter(cat => existingCats.includes(cat));

  sortedCats.forEach(cat => {
    const section = document.createElement('div');
    section.innerHTML = `<div class="section-title">${cat}</div>`;
    
    const grid = document.createElement('div');
    grid.className = 'grid';
    
    data.filter(r => r.category === cat).forEach(r => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openPopup(r);
      
      const m = r.macrosPerPortion || {};
      
      card.innerHTML = `
        <div class="watermark-icon">🍽️</div>
        <div class="card-title">${r.title}</div>
        <div class="card-macros">
          Calories: ${m.calories} | Protein: ${m.protein}g | Sat fat: ${m.saturated || 0}g
        </div>
      `;
      grid.appendChild(card);
    });
    section.appendChild(grid);
    container.appendChild(section);
  });
}

function openPopup(r) {
  const content = document.getElementById('popup-content');
  content.innerHTML = `
    <div class="recipe-detail">
      <h1>${r.title}</h1>
      <p style="color:#aaa; margin-top:10px;">Portions: ${r.portions} | ${r.macrosPerPortion.calories} kcal per portion</p>
      <h3>Ingredients</h3>
      <ul>${(r.ingredients || []).map(i => `<li>${i}</li>`).join('')}</ul>
      <h3>Method</h3>
      <ol>${(r.instructions || []).map(s => `<li>${s}</li>`).join('')}</ol>
    </div>
  `;
  document.getElementById('popup').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function closePopup() {
  document.getElementById('popup').style.display = 'none';
  document.body.style.overflow = 'auto';
}

function search() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const f = allRecipes.filter(r => r.title.toLowerCase().includes(q));
  render(f);
}

init();
</script>
</body>
</html>
