<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>Recipes</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
  background: #000;
  color: #fff;
  -webkit-tap-highlight-color: transparent;
}

.header {
  text-align: center;
  padding: 20px 10px 10px;
  font-size: 24px;
  font-weight: 600;
}

.search-bar {
  width: 90%;
  margin: 10px auto;
  display: block;
  padding: 12px;
  border-radius: 12px;
  border: none;
  outline: none;
  font-size: 16px;
  background: #111;
  color: #fff;
}

.section-title {
  padding: 20px 16px 5px;
  font-size: 18px;
  font-weight: 700;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 12px;
}

/* FIX: Ensure uniform rectangles & left alignment while keeping your gradient */
.card {
  position: relative;
  background: linear-gradient(145deg, #111, #1a1a1a);
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.6);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  aspect-ratio: 1.4 / 1; /* Forces uniform rectangle shape */
  box-sizing: border-box;
}

.card:active { background: #1c1c1e; }

/* FIX: Left aligned and underlined as per screenshots */
.card-title {
  text-align: left;
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 6px;
  text-decoration: underline;
  text-underline-offset: 3px;
  line-height: 1.2;
}

.macros {
  text-align: left;
  font-size: 11px;
  opacity: 0.8;
  margin-top: auto; /* Pushes macros to bottom of uniform box */
}

.watermark {
  position: absolute;
  top: 8px;
  right: 10px;
  font-size: 20px;
  opacity: 0.08;
}

.heart-badge {
  position: absolute;
  top: 8px;
  left: 10px;
  font-size: 14px;
  opacity: 0.85;
}

.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #000;
  display: none;
  overflow-y: auto;
  padding: 30px 20px;
  box-sizing: border-box;
  z-index: 1000;
}

.popup-inner {
  max-width: 600px;
  margin: 0 auto;
}

.popup h2 {
  text-align: center;
  text-decoration: underline;
  margin-top: 20px;
}

.popup h3 {
  border-bottom: 1px solid #222;
  padding-bottom: 8px;
  margin-top: 25px;
}

.popup ul, .popup ol {
  padding-left: 20px;
  color: #ccc;
}

.popup li {
  margin-bottom: 10px;
  line-height: 1.5;
}

.close-btn {
  position: fixed;
  top: 15px;
  right: 20px;
  font-size: 32px;
  cursor: pointer;
  z-index: 1001;
}
</style>
</head>

<body>

<div class="header">Recipes</div>

<input type="text" class="search-bar" placeholder="Search recipes..." onkeyup="searchRecipes()">

<div id="recipes"></div>

<div id="popup" class="popup">
  <div class="close-btn" onclick="closePopup()">✕</div>
  <div id="popup-content" class="popup-inner"></div>
</div>

<script>
let recipes = [];

async function loadRecipes(){
  try{
    const res = await fetch("recipes.json");
    recipes = await res.json();
    displayRecipes(recipes);
  } catch(e){
    console.error("JSON failed to load:", e);
  }
}

function displayRecipes(data){
  const container = document.getElementById("recipes");
  container.innerHTML = "";

  // Grouping logic that ensures all 19 recipes appear under correct headers
  const order = ["Meals", "Bakery", "Desserts", "Heart-Healthy Desserts"];
  let categories = {};

  data.forEach(r => {
    if(!r.category) return;
    if(!categories[r.category]) categories[r.category] = [];
    categories[r.category].push(r);
  });

  order.forEach(catName => {
    if(categories[catName]) {
      const sectionHeader = document.createElement("div");
      sectionHeader.className = "section-title";
      sectionHeader.innerText = catName;
      container.appendChild(sectionHeader);

      let grid = document.createElement("div");
      grid.className = "grid";

      categories[catName].forEach(r => {
        let heart = catName === "Heart-Healthy Desserts" ? `<div class="heart-badge">❤️</div>` : "";
        let m = r.macrosPerPortion || {};

        let card = document.createElement("div");
        card.className = "card";
        card.onclick = () => openPopup(r);
        card.innerHTML = `
          ${heart}
          <div class="watermark">🍽️</div>
          <div class="card-title">${r.title || "Untitled"}</div>
          <div class="macros">
            ${m.calories ?? 0} kcal<br>
            P ${m.protein ?? 0}g | C ${m.carbs ?? 0}g | F ${m.fat ?? 0}g
          </div>
        `;
        grid.appendChild(card);
      });
      container.appendChild(grid);
    }
  });
}

function openPopup(recipe){
  const popup = document.getElementById("popup");
  const content = document.getElementById("popup-content");
  const m = recipe.macrosPerPortion || {};

  content.innerHTML = `
    <h2>${recipe.title}</h2>
    <p style="text-align:center; color:#888;">Portions: ${recipe.portions} | ${m.calories} kcal per portion</p>

    <h3>Ingredients</h3>
    <ul>${(recipe.ingredients || []).map(i => `<li>${i}</li>`).join("")}</ul>

    <h3>Instructions</h3>
    <ol>${(recipe.instructions || []).map(i => `<li>${i}</li>`).join("")}</ol>

    <h3>Full Macros (Total)</h3>
    <p>Protein: ${recipe.macros.protein}g | Carbs: ${recipe.macros.carbs}g | Fat: ${recipe.macros.fat}g | Fibre: ${recipe.macros.fibre}g</p>
  `;

  popup.style.display = "block";
  document.body.style.overflow = "hidden"; // Prevent background scroll
}

function closePopup(){
  document.getElementById("popup").style.display = "none";
  document.body.style.overflow = "auto";
}

function searchRecipes(){
  const value = document.querySelector(".search-bar").value.toLowerCase();
  let filtered = recipes.filter(r => r.title.toLowerCase().includes(value));
  displayRecipes(filtered);
}

loadRecipes();
</script>

</body>
</html>
