<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>Recipes</title>
<style>
  body { 
    margin: 0; 
    font-family: -apple-system, system-ui, sans-serif; 
    background: #000; 
    color: #fff; 
    -webkit-tap-highlight-color: transparent; 
  }
  .header { text-align: center; padding: 25px 10px 10px; font-size: 22px; font-weight: 600; }
  
  /* Restored: High-visibility white search bar */
  .search-container { padding: 0 16px 15px; }
  .search-bar { 
    width: 100%; padding: 12px; border-radius: 8px; border: none; 
    background: #fff; color: #000; font-size: 16px; box-sizing: border-box;
  }

  .section-title { padding: 20px 16px 5px; font-size: 18px; font-weight: 700; }
  
  /* Restored: 2-column uniform grid */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 20px; }
  
  /* Restored: Left-aligned uniform rectangles */
  .card {
    background: #2c2c2e;
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    aspect-ratio: 1.4 / 1;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }
  .card:active { background: #3a3a3c; }
  
  .card-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 6px;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-align: left;
    line-height: 1.2;
  }
  
  .card-macros {
    font-size: 11px;
    color: #b0b0b0;
    text-align: left;
    line-height: 1.4;
    margin-top: auto; /* Keeps macros at the bottom */
  }

  .heart-icon { position: absolute; top: 12px; left: 10px; font-size: 14px; }

  /* Popup Styles */
  .popup {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #000; display: none; overflow-y: auto; z-index: 1000;
  }
  .popup-inner { padding: 40px 20px; max-width: 600px; margin: 0 auto; }
  .close-btn { position: fixed; top: 15px; right: 20px; font-size: 32px; cursor: pointer; z-index: 1001; }
  
  .recipe-detail h1 { text-align: center; font-size: 24px; margin-bottom: 10px; text-decoration: underline; }
  .recipe-detail h3 { border-bottom: 1px solid #333; padding-bottom: 8px; margin-top: 25px; }
  .recipe-detail ul, .recipe-detail ol { padding-left: 20px; color: #ddd; }
  .recipe-detail li { margin-bottom: 12px; font-size: 16px; line-height: 1.5; }
</style>
</head>
<body>

<div class="header">Recipes</div>
<div class="search-container">
  <input type="text" id="searchInput" class="search-bar" placeholder="Search recipes..." onkeyup="search()">
</div>

<div id="recipe-list"></div>

<div id="popup" class="popup">
  <span class="close-btn" onclick="closePopup()">✕</span>
  <div id="popup-content" class="popup-inner"></div>
</div>

<script>
let allRecipes = [];

async function init() {
  try {
    const res = await fetch('recipes.json');
    allRecipes = await res.json();
    render(allRecipes);
  } catch (e) { console.error("Data load failed"); }
}

function render(data) {
  const container = document.getElementById('recipe-list');
  container.innerHTML = '';
  
  const order = ["Meals", "Bakery", "Desserts", "Heart-Healthy Desserts"];
  const existingCats = [...new Set(data.map(r => r.category))];
  const sortedCats = order.filter(cat => existingCats.includes(cat));

  sortedCats.forEach(cat => {
    const section = document.createElement('div');
    section.innerHTML = `<div class="section-title">${cat}</div>`;
    
    const grid = document.createElement('div');
    grid.className = 'grid';
    
    data.filter(r => r.category === cat).forEach(r => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openPopup(r);
      
      const isHeart = cat === "Heart-Healthy Desserts" ? '<span class="heart-icon">❤️</span>' : '';
      const m = r.macrosPerPortion || {};
      
      card.innerHTML = `
        ${isHeart}
        <div class="card-title">${r.title}</div>
        <div class="card-macros">
          ${m.calories ?? 0} kcal<br>
          P ${m.protein ?? 0}g | C ${m.carbs ?? 0}g | F ${m.fat ?? 0}g
        </div>
      `;
      grid.appendChild(card);
    });
    section.appendChild(grid);
    container.appendChild(section);
  });
}

function openPopup(r) {
  const content = document.getElementById('popup-content');
  const m = r.macrosPerPortion || {};
  content.innerHTML = `
    <div class="recipe-detail">
      <h1>${r.title}</h1>
      <p style="text-align:center; color:#aaa;">Portions: ${r.portions} | ${m.calories} kcal per portion</p>
      <h3>Ingredients</h3>
      <ul>${(r.ingredients || []).map(i => `<li>${i}</li>`).join('')}</ul>
      <h3>Method</h3>
      <ol>${(r.instructions || []).map(s => `<li>${s}</li>`).join('')}</ol>
    </div>
  `;
  document.getElementById('popup').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function closePopup() {
  document.getElementById('popup').style.display = 'none';
  document.body.style.overflow = 'auto';
}

function search() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const f = allRecipes.filter(r => r.title.toLowerCase().includes(q));
  render(f);
}

init();
</script>
</body>
</html>
