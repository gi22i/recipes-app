<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Recipes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

        :root { 
            --bg: #f5f5f7; 
            --card: #ffffff; 
            --text: #1d1d1f; 
            --accent: #d4af37; /* Classic Gold */
            --border: #d2d2d7; 
            --secondary: #86868b;
            --cursive: 'Great Vibes', cursive;
        }
        
        @media (prefers-color-scheme: dark) { 
            :root { 
                --bg: #000000; 
                --card: #1c1c1e; 
                --text: #f5f5f7; 
                --accent: #ffdf00; /* Bright Gold for Dark Mode */
                --border: #38383a; 
            } 
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px; 
            line-height: 1.5;
        }
        
        .header { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        .header img { 
            width: 45px; 
            height: 45px; 
            object-fit: contain;
        }
        .header h1 { 
            font-family: var(--cursive);
            font-size: 42px; 
            color: var(--accent);
            margin: 0; 
            font-weight: normal;
        }

        .nav-sticky { 
            position: sticky; 
            top: 0; 
            background: var(--bg); 
            padding-bottom: 15px; 
            z-index: 10; 
            border-bottom: 1px solid var(--border); 
        }
        
        input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 10px; 
            border: 1px solid var(--border); 
            background: var(--card); 
            color: var(--text); 
            margin: 15px 0; 
            box-sizing: border-box;
            font-size: 16px;
        }
        
        .filters { 
            display: flex; 
            gap: 8px; 
            overflow-x: auto; 
            padding-bottom: 5px; 
        }
        .filters::-webkit-scrollbar { display: none; }
        
        .f-btn { 
            padding: 8px 16px; 
            border-radius: 20px; 
            border: 1px solid var(--border); 
            background: var(--card); 
            color: var(--text); 
            font-size: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            white-space: nowrap; 
        }
        .f-btn.active { 
            background: var(--accent); 
            color: #000; 
            border-color: var(--accent); 
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            margin-top: 20px; 
        }
        
        .card { 
            background: var(--card); 
            padding: 15px; 
            border-radius: 15px; 
            border: 1px solid var(--accent); 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            text-align: center;
        }
        
        .card h3 { 
            font-family: var(--cursive);
            font-size: 22px; 
            color: var(--accent);
            margin: 8px 0; 
            line-height: 1.1; 
            min-height: 50px;
        }
        
        .card-stats { 
            margin-top: auto; 
            border-top: 1px solid var(--border); 
            padding-top: 8px; 
        }
        .kcal { 
            font-weight: 700; 
            font-size: 16px; 
            color: var(--text); 
        }

        #modal { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: var(--bg); 
            display: none; 
            z-index: 100; 
            overflow-y: auto; 
            padding: 25px; 
            box-sizing: border-box; 
        }
        .modal-top { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
        }
        .modal-top h2 {
            font-family: var(--cursive);
            font-size: 36px;
            color: var(--accent);
        }
        .close { 
            background: var(--accent); 
            color: #000; 
            border: none; 
            padding: 8px 20px; 
            border-radius: 20px; 
            font-weight: 700; 
            cursor: pointer;
        }
        
        .macro-row { 
            display: flex; 
            justify-content: space-between; 
            padding: 6px 0; 
            border-bottom: 1px dotted var(--border); 
            font-size: 13px; 
        }
        .section { 
            background: var(--card); 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid var(--accent); 
            margin-bottom: 15px; 
        }
        .section h4 { 
            margin: 0 0 10px; 
            color: var(--accent); 
            text-transform: uppercase; 
            font-size: 12px; 
            font-weight: 800;
        }
        
        /* Larger Text for Recipe Content */
        #mIng, #mInst {
            font-size: 18px; 
            line-height: 1.6;
        }

        .category-title {
            font-family: var(--cursive);
            font-size: 32px;
            color: var(--accent);
            margin: 30px 0 10px;
            border-bottom: 2px solid var(--accent);
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="nav-sticky">
        <div class="header">
            <img src="image.png" alt="Icon">
            <h1>My Cook Book</h1>
            <img src="image.png" alt="Icon">
        </div>
        <input type="text" id="search" placeholder="Search for something delicious..." oninput="render()">
        <div class="filters">
            <button class="f-btn active" onclick="setFilter('All', this)">ALL</button>
            <button class="f-btn" onclick="setFilter('Keto', this)">KETO</button>
            <button class="f-btn" onclick="setFilter('Heart', this)">HEART HEALTH</button>
            <button class="f-btn" onclick="setFilter('Sugar', this)">LOW SUGAR</button>
        </div>
    </div>

    <div id="content"></div>

    <div id="modal">
        <div class="modal-top">
            <h2 id="mTitle"></h2>
            <button class="close" onclick="closeM()">CLOSE</button>
        </div>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:20px;">
            <div class="section"><h4>Per Portion</h4><div id="mPortion"></div></div>
            <div class="section"><h4>Full Recipe</h4><div id="mTotal"></div></div>
        </div>
        
        <div class="section">
            <h4>Ingredients</h4>
            <div id="mIng" style="white-space:pre-line;"></div>
        </div>
        
        <div class="section">
            <h4>Instructions</h4>
            <div id="mInst" style="white-space:pre-line;"></div>
        </div>
    </div>

    <script>
        let recipes = [];
        let currentFilter = 'All';

        async function loadData() {
            try {
                const response = await fetch('recipes.json');
                const data = await response.json();
                recipes = data.recipes;
                render();
            } catch (e) {
                console.error("Data error", e);
            }
        }

        function setFilter(filterType, btn) {
            currentFilter = filterType;
            document.querySelectorAll('.f-btn').forEach(x => x.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        function render() {
            const container = document.getElementById('content');
            const query = document.getElementById('search').value.toLowerCase();
            container.innerHTML = '';

            const categories = ["Breakfasts", "Meals", "Bakery", "Desserts"];

            categories.forEach(cat => {
                const filteredList = recipes.filter(r => {
                    if (r.category !== cat) return false;
                    if (query && !r.title.toLowerCase().includes(query)) return false;
                    if (currentFilter === 'Keto' && r.macros.carbs > 10) return false;
                    if (currentFilter === 'Heart' && r.macros.fat_sat > 3) return false;
                    if (currentFilter === 'Sugar' && r.macros.sugar > 5) return false;
                    return true;
                });

                if (filteredList.length > 0) {
                    const sectionTitle = document.createElement('div');
                    sectionTitle.className = 'category-title';
                    sectionTitle.innerText = cat;
                    container.appendChild(sectionTitle);

                    const grid = document.createElement('div');
                    grid.className = 'grid';

                    filteredList.forEach(r => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.onclick = () => openM(r);
                        card.innerHTML = `
                            <h3>${r.title}</h3>
                            <div class="card-stats">
                                <div class="kcal">${Math.round(r.macros.kcal)} kcal</div>
                                <div style="font-size:11px; color:var(--secondary);">P: ${r.macros.protein}g | C: ${r.macros.carbs}g</div>
                            </div>`;
                        grid.appendChild(card);
                    });
                    container.appendChild(grid);
                }
            });
        }

        function openM(r) {
            document.getElementById('mTitle').innerText = r.title;
            document.getElementById('mIng').innerText = r.ingredients;
            document.getElementById('mInst').innerText = r.instructions;
            document.getElementById('mPortion').innerHTML = buildMacroTable(r.macros, 1);
            document.getElementById('mTotal').innerHTML = buildMacroTable(r.macros, r.portions);
            document.getElementById('modal').style.display = 'block';
            window.scrollTo(0,0);
        }

        function closeM() {
            document.getElementById('modal').style.display = 'none';
        }

        function buildMacroTable(m, multiplier) {
            const keys = ['kcal', 'fat', 'carbs', 'protein', 'sugar', 'fiber'];
            return keys.map(k => {
                const val = (m[k] * multiplier).toFixed(1);
                return `<div class="macro-row"><span>${k.toUpperCase()}</span><span>${val}</span></div>`;
            }).join('');
        }

        window.onload = loadData;
    </script>
</body>
</html>
