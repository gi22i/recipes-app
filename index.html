!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Recipe Hub</title>
    <style>
        :root {
            --bg: #f2f2f7;
            --card: #ffffff;
            --text-primary: #000000;
            --text-secondary: #8e8e93;
            --accent: #007aff;
            --border: #e5e5ea;
            --badge-bg: #000000;
            --badge-text: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card: #1c1c1e;
                --text-primary: #ffffff;
                --text-secondary: #8e8e93;
                --accent: #0a84ff;
                --border: #38383a;
                --badge-bg: #ffffff;
                --badge-text: #000000;
            }
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            margin: 0;
            padding: env(safe-area-inset-top) 0 40px 0;
            text-align: center;
        }

        /* HEADER & SEARCH */
        header h1 { font-size: 24px; font-weight: 800; margin: 20px 0; }
        .controls { padding: 0 15px 20px 15px; }
        #searchBar {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: var(--card); color: var(--text-primary); font-size: 17px;
            box-sizing: border-box; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* CATEGORY TITLES */
        .category-title {
            font-size: 20px; font-weight: 800; color: var(--accent);
            margin: 30px 0 15px 0; text-transform: uppercase; letter-spacing: 1px;
        }

        /* GRID SYSTEM: 2 PER ROW */
        .recipe-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 12px; padding: 0 12px; margin-bottom: 20px;
        }

        /* RECIPE CARDS */
        .card {
            background: var(--card); border-radius: 16px; padding: 15px;
            border: 1px solid var(--border); position: relative;
            transition: transform 0.2s ease; cursor: pointer;
        }

        .card-title {
            font-size: 14px; font-weight: 700; margin: 0 0 10px 0;
            min-height: 2.8em; display: flex; align-items: center; justify-content: center;
        }

        /* BADGES (K in Circle) */
        .badge-row { display: flex; justify-content: center; gap: 5px; margin-bottom: 10px; }
        .circle-badge {
            width: 22px; height: 22px; border-radius: 50%;
            background: var(--badge-bg); color: var(--badge-text);
            font-size: 12px; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
        }

        .kcal-tag { font-size: 18px; font-weight: 800; color: var(--accent); margin-bottom: 5px; display: block; }

        /* TAP TO OPEN DETAILS */
        .details {
            max-height: 0; opacity: 0; overflow: hidden;
            transition: all 0.4s ease; border-top: 0 solid var(--border);
        }
        .card.is-open .details {
            max-height: 600px; opacity: 1; margin-top: 15px; padding-top: 15px; border-top-width: 1px;
        }

        /* FLAT MACRO LIST (EUROPEAN) */
        .macro-row {
            display: flex; justify-content: space-between;
            font-size: 11px; padding: 5px 0; border-bottom: 1px solid var(--border);
        }
        .macro-row:last-child { border: none; }
        .label { color: var(--text-secondary); font-weight: 600; text-transform: uppercase; }
        .val { font-weight: 700; }

    </style>
</head>
<body>

    <header><h1>Recipe Hub</h1></header>

    <div class="controls">
        <input type="search" id="searchBar" placeholder="Search recipes..." oninput="render()">
    </div>

    <div id="main-container">
        </div>

    <script>
        let allRecipes = [];

        async function init() {
            try {
                const response = await fetch('recipes.json');
                const data = await response.json();
                allRecipes = data.recipes;
                render();
            } catch (e) {
                document.getElementById('main-container').innerHTML = "Error loading recipes. Check recipes.json";
            }
        }

        function render() {
            const container = document.getElementById('main-container');
            const search = document.getElementById('searchBar').value.toLowerCase();
            container.innerHTML = '';

            const categories = ["Breakfasts", "Meals", "Bakery", "Desserts"];

            categories.forEach(cat => {
                const filtered = allRecipes.filter(r => 
                    r.category === cat && r.title.toLowerCase().includes(search)
                );

                if (filtered.length > 0) {
                    // Add Title
                    const title = document.createElement('div');
                    title.className = 'category-title';
                    title.innerText = cat;
                    container.appendChild(title);

                    // Add Grid
                    const grid = document.createElement('div');
                    grid.className = 'recipe-grid';

                    filtered.forEach(r => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.onclick = () => card.classList.toggle('is-open');

                        const ds = r.designations || [];
                        const m = r.macros;

                        card.innerHTML = `
                            <h2 class="card-title">${r.title}</h2>
                            <div class="badge-row">
                                ${ds.includes('Keto') ? '<div class="circle-badge">K</div>' : ''}
                                ${ds.includes('Low Sugar') ? '<div class="circle-badge">S</div>' : ''}
                                ${ds.includes('Heart') ? '<div class="circle-badge">♥</div>' : ''}
                            </div>
                            <span class="kcal-tag">${m.kcal} kcal</span>
                            <div style="font-size:10px; color:var(--text-secondary);">TAP FOR MACROS</div>

                            <div class="details">
                                <div class="macro-row"><span class="label">Calories</span><span class="val">${m.kcal}</span></div>
                                <div class="macro-row"><span class="label">Fat</span><span class="val">${m.fat}g</span></div>
                                <div class="macro-row"><span class="label">Sat Fat</span><span class="val">${m.fat_sat}g</span></div>
                                <div class="macro-row"><span class="label">Poly Fat</span><span class="val">${m.fat_poly}g</span></div>
                                <div class="macro-row"><span class="label">Mono Fat</span><span class="val">${m.fat_mono}g</span></div>
                                <div class="macro-row"><span class="label">Total Carbs</span><span class="val">${m.carbs}g</span></div>
                                <div class="macro-row"><span class="label">Sugars</span><span class="val">${m.sugar}g</span></div>
                                <div class="macro-row"><span class="label">Sugar Alcohols</span><span class="val">${m.polyols}g</span></div>
                                <div class="macro-row"><span class="label">Protein</span><span class="val">${m.protein}g</span></div>
                                <div class="macro-row"><span class="label">Fibre</span><span class="val">${m.fiber}g</span></div>
                                <div class="macro-row"><span class="label">Salt</span><span class="val">${m.salt}g</span></div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                    container.appendChild(grid);
                }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
