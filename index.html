<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Recipe Archive</title>

<style>
:root {
    --bg: #0a0a0a;
    --accent: #f5f5dc;
    --card: #141414;
}

body {
    background: var(--bg);
    color: #e0e0e0;
    font-family: "Georgia", "Times New Roman", serif;
    padding: 40px;
}

h1 {
    font-size: 3.5rem;
    letter-spacing: 2px;
    margin-bottom: 20px;
}

input, select {
    background: #111;
    color: #eee;
    border: 1px solid #333;
    padding: 10px;
    margin-right: 10px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: var(--card);
    padding: 20px;
    border: 1px solid #2a2a2a;
    cursor: pointer;
}

.card:hover {
    border-color: var(--accent);
}

#modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: #0f0f0f;
    border: 1px solid var(--accent);
    padding: 40px;
    max-width: 800px;
    max-height: 90vh;
    overflow-y: auto;
}

.close {
    float: right;
    font-size: 2rem;
    cursor: pointer;
    color: var(--accent);
}

.macro-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

.macro-table th, .macro-table td {
    border: 1px solid #333;
    padding: 10px;
    font-size: 0.9rem;
}
</style>
</head>

<body>

<h1>The Archive</h1>

<input type="text" id="search" placeholder="Search recipes...">
<select id="categoryFilter">
    <option value="">All Categories</option>
    <option value="Breakfasts">Breakfast</option>
    <option value="Meals">Meals</option>
    <option value="Desserts">Desserts</option>
    <option value="Bakery">Baking</option>
</select>

<select id="tagFilter">
    <option value="">All Tags</option>
    <option value="keto">Keto</option>
    <option value="heart">Heart Healthy</option>
    <option value="low">Low Sugar</option>
</select>

<div id="app" class="grid"></div>

<div id="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<script>
let recipes = [];

async function load() {
    const res = await fetch('recipes.json');
    const data = await res.json();
    recipes = data.recipes;
    render();
}

function render() {
    const search = document.getElementById('search').value.toLowerCase();
    const category = document.getElementById('categoryFilter').value;
    const tag = document.getElementById('tagFilter').value;

    const filtered = recipes.filter(r => {
        return (
            r.title.toLowerCase().includes(search) &&
            (!category || r.category === category) &&
            (!tag || (r.tags && r.tags.includes(tag)))
        );
    });

    document.getElementById('app').innerHTML = filtered.map(r => `
        <div class="card" onclick="openRecipe('${r.title}')">
            <h3>${r.title}</h3>
            <p>${r.portions} Portions</p>
        </div>
    `).join('');
}

function openRecipe(title) {
    const r = recipes.find(x => x.title === title);

    document.getElementById('modal-body').innerHTML = `
        <h2>${r.title}</h2>
        <p><i>${r.portions} Portions</i></p>

        <h4>Ingredients</h4>
        <p>${r.ingredients.replace(/\\n/g,'<br>')}</p>

        <h4>Instructions</h4>
        <p>${r.instructions.replace(/\\n/g,'<br>')}</p>
    `;

    document.getElementById('modal').style.display = 'flex';
}

function closeModal(){
    document.getElementById('modal').style.display='none';
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('categoryFilter').addEventListener('change', render);
document.getElementById('tagFilter').addEventListener('change', render);

window.onload = load;
</script>

</body>
</html>
