<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Recipe Hub</title>
    <style>
        .recipe-card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin: 10px; display: inline-block; width: 250px; vertical-align: top; }
        .icon-low-sugar { color: #2ecc71; font-weight: bold; font-size: 0.8em; border: 1px solid #2ecc71; padding: 2px 5px; border-radius: 4px; display: inline-block; margin-top: 5px; }
        .filter-section { margin-bottom: 20px; padding: 10px; background: #f9f9f9; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="filter-section" id="filterBar">
        <label for="categorySelect">Category:</label>
        <select id="categorySelect" onchange="toggleFilters()">
            <option value="all">All</option>
            <option value="main">Main Course</option>
            <option value="bakery">Bakery</option>
            <option value="dessert">Dessert</option>
        </select>

        <span id="sugarFilterWrapper" class="hidden">
            <input type="checkbox" id="lowSugarFilter" onclick="filterRecipes()"> 
            <label for="lowSugarFilter">Show Low Sugar Only (< 5g)</label>
        </span>
    </div>

    <div id="recipeContainer">
        </div>

    <script>
        const recipes = [
            { name: "Lemon Protein Muffins", category: "bakery", sugar: 3.2, protein: 12, calories: 180 },
            { name: "Chocolate Whey Brownies", category: "bakery", sugar: 8.5, protein: 15, calories: 210 },
            { name: "Vanilla Greek Yogurt Parfait", category: "dessert", sugar: 4.1, protein: 18, calories: 150 },
            { name: "Grilled Herb Chicken", category: "main", sugar: 0.5, protein: 35, calories: 280 }
        ];

        function toggleFilters() {
            const category = document.getElementById('categorySelect').value;
            const filterWrapper = document.getElementById('sugarFilterWrapper');
            // Logic: Only show sugar filter for bakery or dessert
            if (category === 'bakery' || category === 'dessert') {
                filterWrapper.classList.remove('hidden');
            } else {
                filterWrapper.classList.add('hidden');
                document.getElementById('lowSugarFilter').checked = false;
            }
            renderRecipes();
        }

        function renderRecipes() {
            const container = document.getElementById('recipeContainer');
            const selectedCat = document.getElementById('categorySelect').value;
            const lowSugarOnly = document.getElementById('lowSugarFilter').checked;

            container.innerHTML = '';

            recipes.forEach(recipe => {
                if (selectedCat !== 'all' && recipe.category !== selectedCat) return;
                if (lowSugarOnly && recipe.sugar >= 5) return;

                const card = document.createElement('div');
                card.className = 'recipe-card';
                
                let sugarTag = '';
                // Only show icon for Bakery/Dessert categories
                if ((recipe.category === 'bakery' || recipe.category === 'dessert') && recipe.sugar < 5) {
                    sugarTag = '<div class="icon-low-sugar">🍃 LOW SUGAR</div>';
                }

                card.innerHTML = `
                    <h3>${recipe.name}</h3>
                    <p>Protein: ${recipe.protein}g</p>
                    <p>Sugar: ${recipe.sugar}g</p>
                    ${sugarTag}
                `;
                container.appendChild(card);
            });
        }

        renderRecipes();
    </script>
</body>
</html>
