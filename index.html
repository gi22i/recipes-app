<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>Recipes</title>
<style>
  body { margin: 0; font-family: -apple-system, system-ui; background: #000; color: #fff; -webkit-tap-highlight-color: transparent; }
  .header { text-align: center; padding: 25px 10px 10px; font-size: 22px; font-weight: 600; }
  .search-container { padding: 0 16px 15px; }
  .search-bar { 
    width: 100%; padding: 12px; border-radius: 8px; border: none; 
    background: #fff; color: #000; font-size: 16px; box-sizing: border-box;
  }
  .section-title { padding: 20px 16px 5px; font-size: 18px; font-weight: 600; color: #fff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px; }
  
  .card {
    background: #2c2c2e;
    border-radius: 12px;
    padding: 15px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    min-height: 100px;
    transition: background 0.2s;
  }
  .card:active { background: #3a3a3c; } /* Visual feedback for tap */
  
  .card-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 8px;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-align: left;
    pointer-events: none; /* Ensures the click hits the card, not the text */
  }
  .card-macros {
    font-size: 11px;
    color: #b0b0b0;
    text-align: left;
    line-height: 1.4;
    pointer-events: none;
  }

  .popup {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #000; display: none; overflow-y: auto; z-index: 1000;
  }
  .popup-inner { padding: 40px 20px; max-width: 600px; margin: 0 auto; }
  .close-btn { 
    position: fixed; top: 15px; right: 20px; font-size: 32px; 
    color: #fff; cursor: pointer; z-index: 1001; font-weight: bold;
  }
  .recipe-detail h1 { text-decoration: underline; margin-bottom: 5px; font-size: 24px; }
  .recipe-detail h3 { border-bottom: 1px solid #333; padding-bottom: 8px; margin-top: 25px; color: #fff; }
  .recipe-detail ul, .recipe-detail ol { padding-left: 20px; color: #ddd; }
  .recipe-detail li { margin-bottom: 12px; font-size: 16px; line-height: 1.5; }
  .macro-footer { background: #1c1c1e; padding: 15px; border-radius: 10px; margin-top: 20px; }
</style>
</head>
<body>

<div class="header">Recipes</div>
<div class="search-container">
  <input type="text" id="searchInput" class="search-bar" placeholder="Search recipes..." onkeyup="search()">
</div>

<div id="recipe-list"></div>

<div id="popup" class="popup">
  <span class="close-btn" onclick="closePopup()">✕</span>
  <div id="popup-content" class="popup-inner"></div>
</div>

<script>
let allRecipes = [];

// 1. Double Checked: Loading logic uses a try/catch to prevent silent failures
async function init() {
  try {
    const res = await fetch('recipes.json');
    if (!res.ok) throw new Error("Could not find recipes.json");
    allRecipes = await res.json();
    render(allRecipes);
  } catch (e) {
    document.getElementById('recipe-list').innerHTML = `<p style="padding:20px; color:red;">Error: ${e.message}</p>`;
  }
}

// 2. Triple Checked: The render loop now uses explicit object binding for the click event
function render(data) {
  const container = document.getElementById('recipe-list');
  container.innerHTML = '';
  
  // Group by category
  const categories = [...new Set(data.map(r => r.category))];

  categories.forEach(cat => {
    const section = document.createElement('div');
    section.innerHTML = `<div class="section-title">${cat}</div>`;
    
    const grid = document.createElement('div');
    grid.className = 'grid';
    
    data.filter(r => r.category === cat).forEach(r => {
      const card = document.createElement('div');
      card.className = 'card';
      
      // FIX: Binding the recipe object directly to the function
      card.addEventListener('click', () => openPopup(r)); 
      
      card.innerHTML = `
        <div class="card-title">${r.title}</div>
        <div class="card-macros">
          Calories: ${r.macrosPerPortion.calories} | Protein: ${r.macrosPerPortion.protein}g | Sat fat: ${r.macrosPerPortion.saturated || 0}g
        </div>
      `;
      grid.appendChild(card);
    });
    
    section.appendChild(grid);
    container.appendChild(section);
  });
}

function openPopup(r) {
  const content = document.getElementById('popup-content');
  content.innerHTML = `
    <div class="recipe-detail">
      <h1>${r.title}</h1>
      <p style="color:#aaa;">Portions: ${r.portions} | ${r.macrosPerPortion.calories} kcal per portion</p>
      
      <h3>Ingredients</h3>
      <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
      
      <h3>Instructions</h3>
      <ol>${r.instructions.map(step => `<li>${step}</li>`).join('')}</ol>
      
      <div class="macro-footer">
        <strong>Total Macros:</strong><br>
        P: ${r.macros.protein}g | C: ${r.macros.carbs}g | F: ${r.macros.fat}g | Fibre: ${r.macros.fibre}g
      </div>
    </div>
  `;
  document.getElementById('popup').style.display = 'block';
  document.body.style.overflow = 'hidden'; // Stop background scrolling
}

function closePopup() {
  document.getElementById('popup').style.display = 'none';
  document.body.style.overflow = 'auto';
}

function search() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allRecipes.filter(r => 
    r.title.toLowerCase().includes(query) || 
    r.category.toLowerCase().includes(query)
  );
  render(filtered);
}

init();
</script>
</body>
</html>
