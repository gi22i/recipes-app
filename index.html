<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Recipe Archive</title>

<style>
:root {
    --bg: #0a0a0a;
    --accent: #f5f5dc;
    --card: #141414;
}

body {
    background: var(--bg);
    color: #e0e0e0;
    font-family: "Georgia", "Times New Roman", serif;
    padding: 40px;
}

/* Title */
h1 {
    font-size: 3rem;
    letter-spacing: 2px;
    margin-bottom: 30px;
}

/* Search + filters */
.controls {
    margin-bottom: 30px;
}

input, select {
    padding: 10px;
    margin: 5px;
    background: #111;
    color: white;
    border: 1px solid #333;
}

/* Grid */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: var(--card);
    padding: 20px;
    border: 1px solid #2a2a2a;
    cursor: pointer;
}

.card:hover {
    border-color: var(--accent);
}

/* Modal */
#modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: #0f0f0f;
    border: 1px solid var(--accent);
    padding: 40px;
    max-width: 800px;
    max-height: 90vh;
    overflow-y: auto;
}

.close {
    float: right;
    cursor: pointer;
    color: var(--accent);
    font-size: 2rem;
}

/* Table */
.macro-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

.macro-table th, .macro-table td {
    border: 1px solid #333;
    padding: 10px;
    font-size: 0.9rem;
}
</style>
</head>

<body>

<h1>The Archive</h1>

<div class="controls">
    <input type="text" id="search" placeholder="Search recipes...">
    
    <select id="category">
        <option value="">All Categories</option>
        <option>Breakfasts</option>
        <option>Meals</option>
        <option>Desserts</option>
        <option>Bakery</option>
    </select>

    <select id="label">
        <option value="">All Labels</option>
        <option value="keto">Keto</option>
        <option value="heart">Heart Healthy</option>
        <option value="low">Low Sugar</option>
    </select>
</div>

<div id="app" class="grid"></div>

<div id="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<script>
let recipes = [];

async function load() {
    const res = await fetch('recipes.json');
    const data = await res.json();
    recipes = data.recipes.map(addLabels);
    render();
}

/* Label logic (no JSON modification needed) */
function addLabels(r) {
    let labels = [];

    if (r.macros_per_portion.carbs < 20) labels.push("keto");
    if (r.macros_per_portion.fat < 10) labels.push("heart");
    if (r.macros_per_portion.sugar < 5) labels.push("low");

    r.labels = labels;
    return r;
}

function render() {
    const search = document.getElementById('search').value.toLowerCase();
    const category = document.getElementById('category').value;
    const label = document.getElementById('label').value;

    const filtered = recipes.filter(r => {
        return (!search || r.title.toLowerCase().includes(search)) &&
               (!category || r.category === category) &&
               (!label || r.labels.includes(label));
    });

    document.getElementById('app').innerHTML = filtered.map(r => `
        <div class="card" onclick="openRecipe('${r.title}')">
            <h3>${r.title}</h3>
            <p>${r.portions} Portions</p>
        </div>
    `).join('');
}

function openRecipe(title) {
    const r = recipes.find(rec => rec.title === title);
    const m = r.macros_per_portion;
    const t = r.macros_total;

    document.getElementById('modal-body').innerHTML = `
        <h2>${r.title}</h2>
        <p><i>${r.portions} Portions</i></p>

        <p><b>Labels:</b> ${r.labels.join(', ') || 'None'}</p>

        <h4>Nutrition Table</h4>
        <table class="macro-table">
            <tr><th>Macro</th><th>Per Portion</th><th>Total</th></tr>
            <tr><td>Calories</td><td>${m.kcal}</td><td>${t.kcal}</td></tr>
            <tr><td>Fat</td><td>${m.fat}</td><td>${t.fat}</td></tr>
            <tr><td>Saturates</td><td>${m.fat_sat}</td><td>${t.fat_sat}</td></tr>
            <tr><td>Unsaturates</td><td>${m.fat_unsat}</td><td>${t.fat_unsat}</td></tr>
            <tr><td>Carbs</td><td>${m.carbs}</td><td>${t.carbs}</td></tr>
            <tr><td>Sugar</td><td>${m.sugar}</td><td>${t.sugar}</td></tr>
            <tr><td>Fibre</td><td>${m.fiber}</td><td>${t.fiber}</td></tr>
            <tr><td>Protein</td><td>${m.protein}</td><td>${t.protein}</td></tr>
        </table>

        <h4>Instructions</h4>
        <p>${r.instructions.replace(/\n/g, "<br>")}</p>
    `;

    document.getElementById('modal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('modal').style.display = 'none';
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('category').addEventListener('change', render);
document.getElementById('label').addEventListener('change', render);

window.onload = load;
</script>

</body>
</html>
