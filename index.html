<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recipe Manager</title>
    <style>
        :root { --bg: #f0f0f0; --card: #ffffff; --text: #000000; --accent: #007aff; --border: #ccc; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        
        #searchBar { width: 100%; padding: 12px; margin-bottom: 20px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 8px; }
        
        .category-header { font-size: 22px; font-weight: bold; margin: 30px 0 10px; border-bottom: 2px solid var(--text); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .recipe-card { background: var(--card); padding: 15px; border: 1px solid var(--border); border-radius: 8px; text-align: center; cursor: pointer; }
        .recipe-card h3 { margin: 0 0 10px; font-size: 16px; }

        /* POPUP MODAL */
        #modalOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 100; }
        #recipePopup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: none; z-index: 101; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        
        .modal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { padding: 10px 20px; background: #cc0000; color: white; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }

        /* SIDE BY SIDE MACRO BOXES */
        .macro-wrapper { display: flex; gap: 10px; margin-bottom: 20px; }
        .macro-box { flex: 1; background: var(--card); border: 1px solid var(--border); padding: 10px; border-radius: 8px; }
        .macro-box h4 { margin: 0 0 10px; font-size: 13px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .m-row { display: flex; justify-content: space-between; font-size: 11px; padding: 3px 0; border-bottom: 1px solid #eee; }
        .m-row:last-child { border: none; }

        .info-section { background: var(--card); padding: 15px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 15px; }
        .section-h { font-weight: bold; text-transform: uppercase; margin-bottom: 10px; display: block; border-left: 5px solid var(--accent); padding-left: 10px; }
    </style>
</head>
<body>

    <input type="text" id="searchBar" placeholder="Search recipes..." oninput="render()">
    <div id="content"></div>

    <div id="modalOverlay" onclick="closePopup()"></div>
    <div id="recipePopup">
        <div class="modal-nav">
            <h2 id="popTitle" style="margin:0;"></h2>
            <button class="close-btn" onclick="closePopup()">CLOSE</button>
        </div>

        <div class="macro-wrapper">
            <div class="macro-box">
                <h4>Macros Per Portion</h4>
                <div id="macrosPortion"></div>
            </div>
            <div class="macro-box">
                <h4>Total Macros (All Portions)</h4>
                <div id="macrosTotal"></div>
            </div>
        </div>

        <div class="info-section">
            <span class="section-h">Ingredients</span>
            <div id="popIngredients" style="white-space: pre-line;"></div>
        </div>

        <div class="info-section">
            <span class="section-h">Instructions</span>
            <div id="popInstructions" style="white-space: pre-line;"></div>
        </div>
    </div>

    <script>
        let recipes = [];

        async function load() {
            const res = await fetch('recipes.json');
            const data = await res.json();
            recipes = data.recipes;
            render();
        }

        function render() {
            const div = document.getElementById('content');
            const term = document.getElementById('searchBar').value.toLowerCase();
            div.innerHTML = '';

            ["Breakfasts", "Meals", "Bakery", "Desserts"].forEach(cat => {
                const list = recipes.filter(r => r.category === cat && r.title.toLowerCase().includes(term));
                if (list.length > 0) {
                    div.innerHTML += `<div class="category-header">${cat}</div>`;
                    const grid = document.createElement('div');
                    grid.className = 'grid';
                    list.forEach(r => {
                        const card = document.createElement('div');
                        card.className = 'recipe-card';
                        card.onclick = () => openPopup(r);
                        card.innerHTML = `<h3>${r.title}</h3><b>${r.macros.kcal} kcal</b>`;
                        grid.appendChild(card);
                    });
                    div.appendChild(grid);
                }
            });
        }

        function openPopup(r) {
            document.getElementById('popTitle').innerText = r.title;
            document.getElementById('popIngredients').innerText = r.ingredients;
            document.getElementById('popInstructions').innerText = r.instructions;
            
            document.getElementById('macrosPortion').innerHTML = buildMacros(r.macros, 1);
            document.getElementById('macrosTotal').innerHTML = buildMacros(r.macros, r.portions);

            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('recipePopup').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closePopup() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('recipePopup').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function buildMacros(m, mult) {
            const keys = [['kcal','kcal'],['fat','g'],['fat_sat','g'],['fat_poly','g'],['fat_mono','g'],['carbs','g'],['sugar','g'],['polyols','g'],['protein','g'],['fiber','g'],['salt','g']];
            return keys.map(k => `
                <div class="m-row">
                    <span>${k[0].toUpperCase()}</span>
                    <span>${(m[k[0]] * mult).toFixed(1)}${k[1]}</span>
                </div>
            `).join('');
        }

        window.onload = load;
    </script>
</body>
</html>
