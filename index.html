<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Recipe Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --accent: #f5f5dc; 
            --text-main: #e0e0e0;
            --text-dim: #999;
            --modal-bg: rgba(0, 0, 0, 0.9);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Lora', serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            max-width: 800px;
            width: 100%;
            margin-bottom: 60px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 30px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 8vw, 3.5rem);
            color: var(--accent);
            margin: 0;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .subtitle { font-style: italic; color: var(--text-dim); margin-top: 10px; letter-spacing: 2px; }

        #app-container { width: 100%; max-width: 1100px; }

        .category-section { margin-bottom: 60px; }

        .category-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--accent);
            border-left: 4px solid var(--accent);
            padding-left: 20px;
            margin-bottom: 30px;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .recipe-card {
            background: var(--card-bg);
            border: 1px solid #2a2a2a;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .recipe-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            background: #1a1a1a;
        }

        .recipe-card h3 {
            font-family: 'Playfair Display', serif;
            margin: 0 0 10px 0;
            color: var(--accent);
        }

        .recipe-card .card-meta {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* MODAL STYLES */
        #recipe-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-bg);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: #1a1a1a;
            border: 2px solid var(--accent);
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 40px;
            box-sizing: border-box;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            color: var(--accent);
            cursor: pointer;
            line-height: 1;
        }

        .modal-body h2 {
            font-family: 'Playfair Display', serif;
            color: var(--accent);
            font-size: 2.5rem;
            margin-top: 0;
        }

        .recipe-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 40px;
            margin-top: 30px;
        }

        .ingredients-list {
            background: #111;
            padding: 20px;
            border-left: 2px solid var(--accent);
        }

        .instructions-text {
            line-height: 1.8;
            font-size: 1.05rem;
        }

        .modal-macros {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #333;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .macro-box {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .macro-box span { color: var(--accent); font-weight: bold; }

        @media (max-width: 700px) {
            .recipe-detail-grid { grid-template-columns: 1fr; }
            .modal-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>The Archive</h1>
        <div class="subtitle">A Digital Grimoire of Recipes</div>
    </header>

    <main id="app-container"></main>

    <div id="recipe-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <footer>&mdash; Organized Digitally 2026 &mdash;</footer>

    <script>
        let allRecipes = [];

        async function loadRecipes() {
            try {
                const response = await fetch('recipes.json');
                const data = await response.json();
                allRecipes = data.recipes;
                render();
            } catch (err) {
                console.error("Archive inaccessible:", err);
            }
        }

        function render() {
            const container = document.getElementById('app-container');
            const categories = [...new Set(allRecipes.map(r => r.category))];

            container.innerHTML = categories.map(cat => `
                <section class="category-section">
                    <h2 class="category-title">${cat}</h2>
                    <div class="recipe-grid">
                        ${allRecipes.filter(r => r.category === cat).map(recipe => `
                            <div class="recipe-card" onclick="openRecipe('${recipe.title.replace(/'/g, "\\'")}')">
                                <div class="card-meta">${recipe.portions} Portions</div>
                                <h3>${recipe.title}</h3>
                                <div class="card-meta">View Details ❧</div>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `).join('');
        }

        function openRecipe(title) {
            const recipe = allRecipes.find(r => r.title === title);
            const modal = document.getElementById('recipe-modal');
            const body = document.getElementById('modal-body');

            body.innerHTML = `
                <h2>${recipe.title}</h2>
                <p class="subtitle">${recipe.portions} Portions | ${recipe.portion_size || 'N/A'}</p>
                
                <div class="recipe-detail-grid">
                    <div class="ingredients-list">
                        <h4 style="color:var(--accent); margin-top:0;">Ingredients</h4>
                        <div style="white-space: pre-wrap;">${recipe.ingredients}</div>
                    </div>
                    <div class="instructions-text">
                        <h4 style="color:var(--accent); margin-top:0;">Preparation</h4>
                        <div>${recipe.instructions.replace(/\n/g, '<br><br>')}</div>
                    </div>
                </div>

                <div class="modal-macros">
                    <div class="macro-box">Calories: <span>${recipe.macros.kcal} kcal</span></div>
                    <div class="macro-box">Protein: <span>${recipe.macros.protein}g</span></div>
                    <div class="macro-box">Fat: <span>${recipe.macros.fat}g</span></div>
                    <div class="macro-box">Carbs: <span>${recipe.macros.carbs}g</span></div>
                </div>
            `;

            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('recipe-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('recipe-modal');
            if (event.target == modal) closeModal();
        }

        window.addEventListener('DOMContentLoaded', loadRecipes);
    </script>
</body>
</html>
