<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipes</title>

<style>
body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
  background:#000;
  color:#fff;
}

.header{
  text-align:center;
  padding:20px;
  font-size:22px;
  font-weight:600;
}

.search-bar{
  width:90%;
  margin:10px auto;
  display:block;
  padding:12px;
  border-radius:12px;
  border:none;
  background:#111;
  color:#fff;
}

.section-title{
  padding:12px 16px;
  font-weight:600;
  font-size:18px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:12px;
}

.card{
  background:#111;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
}

.card-title{
  font-weight:600;
  margin-bottom:6px;
}

.macros{
  font-size:12px;
  opacity:0.8;
}

.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  display:none;
  overflow:auto;
  padding:20px;
}

.close-btn{
  position:fixed;
  top:10px;
  right:15px;
  font-size:24px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">Recipes</div>

<input class="search-bar" placeholder="Search..." onkeyup="searchRecipes()">

<div id="recipes"></div>

<div id="popup" class="popup">
  <div class="close-btn" onclick="closePopup()">✕</div>
  <div id="popup-content"></div>
</div>

<script>

const recipes = /* JSON START */ 
[
  /* 🔽 YOUR FULL JSON INSERTED HERE EXACTLY AS PROVIDED */
  {
    "title": "Turkey Burgers",
    "category": "Meals",
    "ingredients": ["400g turkey mince","1 egg","1½ tsp psyllium husk","1 tsp soy sauce","garlic powder","smoked paprika","salt","pepper","2 burger buns"],
    "instructions": ["Add turkey mince to a bowl.","Mix in egg, psyllium husk, soy sauce and seasonings.","Rest 5 min.","Form patties.","Air fry 190°C 11–13 min.","Serve in buns."],
    "macros": {"calories":620,"protein":60,"carbs":30,"fat":24,"fibre":3,"saturated":6},
    "portions":2,
    "macrosPerPortion": {"calories":310,"protein":30,"carbs":15,"fat":12,"fibre":1.5,"saturated":3},
    "notes": ""
  }
]
/* JSON END */;

function displayRecipes(data){

  const container = document.getElementById("recipes");
  container.innerHTML = "";

  let categories = {};

  data.forEach(r => {
    if(!categories[r.category]) categories[r.category] = [];
    categories[r.category].push(r);
  });

  for(let category in categories){

    container.innerHTML += `<div class="section-title">${category}</div>`;

    let grid = document.createElement("div");
    grid.className = "grid";

    categories[category].forEach(r => {

      let card = document.createElement("div");
      card.className = "card";
      card.onclick = () => openPopup(r);

      card.innerHTML = `
        <div class="card-title">${r.title}</div>
        <div class="macros">
          ${r.macrosPerPortion.calories} kcal • 
          P ${r.macrosPerPortion.protein}g • 
          C ${r.macrosPerPortion.carbs}g • 
          F ${r.macrosPerPortion.fat}g
        </div>
      `;

      grid.appendChild(card);

    });

    container.appendChild(grid);
  }
}

function openPopup(recipe){

  const popup = document.getElementById("popup");
  const content = document.getElementById("popup-content");

  content.innerHTML = `
    <h2>${recipe.title}</h2>

    <p><strong>Portions:</strong> ${recipe.portions}</p>

    <h3>Ingredients</h3>
    <ul>${recipe.ingredients.map(i => `<li>${i}</li>`).join("")}</ul>

    <h3>Instructions</h3>
    <ol>${recipe.instructions.map(i => `<li>${i}</li>`).join("")}</ol>

    <h3>Macros (Per Portion)</h3>
    <p>
      Calories: ${recipe.macrosPerPortion.calories}<br>
      Protein: ${recipe.macrosPerPortion.protein}g<br>
      Carbs: ${recipe.macrosPerPortion.carbs}g<br>
      Fat: ${recipe.macrosPerPortion.fat}g<br>
      Fibre: ${recipe.macrosPerPortion.fibre}g
    </p>
  `;

  popup.style.display = "block";
}

function closePopup(){
  document.getElementById("popup").style.display = "none";
}

function searchRecipes(){
  const value = document.querySelector(".search-bar").value.toLowerCase();

  let filtered = recipes.filter(r =>
    r.title.toLowerCase().includes(value)
  );

  displayRecipes(filtered);
}

displayRecipes(recipes);

</script>

</body>
</html>
