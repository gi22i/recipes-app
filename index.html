<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  /* AUTO LIGHT/DARK MODE SYSTEM */
  :root {
    --bg-color: #ffffff;
    --card-bg: #f2f2f7;
    --text-primary: #000000;
    --text-secondary: #6c6c70;
    --search-bg: #e3e3e8;
    --border-color: #d1d1d6;
    --circle-bg: rgba(0, 0, 0, 0.1);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --text-primary: #ffffff;
      --text-secondary: #aeaeb2;
      --search-bg: #1c1c1e;
      --border-color: #38383a;
      --circle-bg: rgba(255, 255, 255, 0.2);
    }
  }

  body { 
    margin: 0; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    background: var(--bg-color); 
    color: var(--text-primary); 
    -webkit-font-smoothing: antialiased;
  }

  .header { text-align: center; padding: 25px 10px 5px; font-size: 22px; font-weight: 700; }
  .search-container { padding: 0 16px 15px; }
  .search-bar { 
    width: 100%; padding: 12px; border-radius: 10px; border: none; 
    background: var(--search-bg); color: var(--text-primary); font-size: 16px; box-sizing: border-box; 
  }

  .section-title { padding: 25px 16px 10px; font-size: 20px; font-weight: 800; clear: both; }
  
  /* STABLE GRID FOR WEB CLIPS */
  .grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 16px 30px; }
  
  .card {
    background: var(--card-bg); 
    border-radius: 12px; 
    cursor: pointer;
    display: flex; 
    flex-direction: column; 
    justify-content: center; /* Vertical centering */
    align-items: center;     /* Horizontal block centering */
    text-align: center;      /* Horizontal text line centering */
    width: calc(50% - 5px); 
    height: 90px;            /* Fixed height for stability */
    position: relative; 
    box-sizing: border-box;
    padding: 10px;
    overflow: hidden;
  }

  .card-title {
    font-size: 16px; 
    font-weight: 700; 
    margin: 0 auto 4px auto; 
    text-decoration: underline; 
    text-underline-offset: 3px; 
    width: 100%; 
    line-height: 1.2; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis;
    display: block; 
  }
  
  .card-macros { 
    font-size: 11px; 
    font-weight: 600; 
    color: var(--text-secondary); 
    width: 100%; 
    display: block;
    margin: 0 auto;
    letter-spacing: -0.1px;
  }

  /* ICONS & BADGES */
  .watermark-icon { position: absolute; top: 8px; left: 10px; font-size: 14px; opacity: 0.2; z-index: 1; }
  .badge-right { position: absolute; top: 8px; right: 10px; z-index: 1; }
  .keto-circle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; background: var(--circle-bg); border-radius: 50%;
    color: var(--text-primary); font-size: 11px; font-weight: 900;
  }

  /* POPUP MODAL */
  .popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); display: none; overflow-y: auto; z-index: 1000; }
  .popup-inner { padding: 50px 20px; max-width: 600px; margin: 0 auto; }
  .close-btn { position: fixed; top: 20px; right: 20px; font-size: 30px; cursor: pointer; z-index: 1001; color: var(--text-primary); }
  
  .macro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
  .macro-box { background: var(--card-bg); padding: 15px; border-radius: 12px; font-size: 13px; line-height: 1.6; border: 1px solid var(--border-color); }
  
  .recipe-detail h1 { font-size: 26px; text-align: center; margin-bottom: 20px; text-decoration: underline; }
  .recipe-detail h3 { border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 30px; }
  .recipe-detail li { margin-bottom: 12px; font-size: 16px; line-height: 1.4; color: var(--text-secondary); }
</style>
</head>

function render(data) {
  const container = document.getElementById('recipe-list');
  container.innerHTML = '';
  const order = ["Meals", "Keto", "Bakery", "Desserts", "Heart-Healthy Desserts"];

  order.forEach(cat => {
    const filtered = data.filter(r => r.category === cat);
    if (filtered.length === 0) return;
    
    const title = document.createElement('div');
    title.className = 'section-title';
    title.innerText = cat;
    container.appendChild(title);
    
    const grid = document.createElement('div');
    grid.className = 'grid';
    
    filtered.forEach(r => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openPopup(r);
      
      let badge = cat.includes("Heart") ? '❤️' : '';
      if (cat === "Keto") badge = '<div class="keto-circle">K</div>';

      card.innerHTML = `
        <div class="watermark-icon">🍽️</div>
        <div class="badge-right">${badge}</div>
        <div class="card-title">${r.title}</div>
        <div class="card-macros">${r.macrosPerPortion.calories}kcal | P:${r.macrosPerPortion.protein}g | C:${r.macrosPerPortion.carbs}g | F:${r.macrosPerPortion.fat}g</div>`;
      grid.appendChild(card);
    });
    container.appendChild(grid);
  });
}

function openPopup(r) {
  const content = document.getElementById('popup-content');
  const buildMacros = (obj) => `
    <strong>Calories: ${obj.calories}kcal</strong><br>
    P: ${obj.protein}g | C: ${obj.carbs}g | F: ${obj.fat}g<br>
    Sat Fat: ${obj.satFat}g | Sugar: ${obj.sugar}g<br>
    Fiber: ${obj.fiber}g | Salt: ${obj.salt}g`;

  content.innerHTML = `
    <div class="recipe-detail">
      <h1>${r.title}</h1>
      <div class="macro-grid">
        <div class="macro-box"><strong>Per Portion</strong><br>${buildMacros(r.macrosPerPortion)}</div>
        <div class="macro-box"><strong>Full Recipe</strong><br>${buildMacros(r.macros)}</div>
      </div>
      <h3>Ingredients</h3><ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
      <h3>Method</h3><ol>${r.instructions.map(s => `<li>${s}</li>`).join('')}</ol>
    </div>`;
  document.getElementById('popup').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function closePopup() { 
  document.getElementById('popup').style.display = 'none'; 
  document.body.style.overflow = 'auto'; 
}

function search() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = recipes.filter(r => 
    r.title.toLowerCase().includes(q) || 
    r.ingredients.some(i => i.toLowerCase().includes(q))
  );
  render(filtered);
}

// Start
render(recipes);
