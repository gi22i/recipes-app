<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Recipe Manager</title>
    <style>
        :root { 
            --bg: #f5f5f7; 
            --card: #ffffff; 
            --text: #1d1d1f; 
            --accent: #0071e3; 
            --border: #d2d2d7; 
            --secondary: #86868b; 
        }
        @media (prefers-color-scheme: dark) { 
            :root { 
                --bg: #000000; 
                --card: #1c1c1e; 
                --text: #f5f5f7; 
                --accent: #0a84ff; 
                --border: #38383a; 
            } 
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px; 
            line-height: 1.5;
        }
        
        .header { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        .header img { 
            width: 35px; 
            height: 35px; 
            object-fit: contain;
        }
        .header h1 { 
            font-size: 28px; 
            font-weight: 700; 
            margin: 0; 
            letter-spacing: -0.5px;
        }

        .nav-sticky { 
            position: sticky; 
            top: 0; 
            background: var(--bg); 
            padding-bottom: 15px; 
            z-index: 10; 
            border-bottom: 1px solid var(--border); 
        }
        
        input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 10px; 
            border: 1px solid var(--border); 
            background: var(--card); 
            color: var(--text); 
            margin: 15px 0; 
            box-sizing: border-box;
            font-size: 16px;
        }
        
        .filters { 
            display: flex; 
            gap: 8px; 
            overflow-x: auto; 
            padding-bottom: 5px; 
            -webkit-overflow-scrolling: touch;
        }
        .filters::-webkit-scrollbar { display: none; }
        
        .f-btn { 
            padding: 8px 16px; 
            border-radius: 20px; 
            border: 1px solid var(--border); 
            background: var(--card); 
            color: var(--text); 
            font-size: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            white-space: nowrap; 
            transition: all 0.2s ease;
        }
        .f-btn.active { 
            background: var(--accent); 
            color: white; 
            border-color: var(--accent); 
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            margin-top: 20px; 
        }
        
        .card { 
            background: var(--card); 
            padding: 15px; 
            border-radius: 15px; 
            border: 1px solid var(--border); 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            transition: transform 0.1s ease;
        }
        .card:active { transform: scale(0.98); }
        
        .card h3 { 
            font-size: 14px; 
            margin: 8px 0; 
            line-height: 1.3; 
            height: 36px; 
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden; 
        }
        
        .card-stats { 
            margin-top: auto; 
            border-top: 1px solid var(--border); 
            padding-top: 8px; 
        }
        .kcal { 
            font-weight: 700; 
            font-size: 15px; 
            color: var(--accent); 
        }
        .vitals { 
            display: flex; 
            gap: 5px; 
            font-size: 10px; 
            color: var(--secondary); 
            font-weight: 700; 
        }

        .badges { 
            display: flex; 
            gap: 4px; 
            margin-bottom: 5px; 
        }
        .dot { 
            width: 18px; 
            height: 18px; 
            border-radius: 50%; 
            background: #333; 
            color: white; 
            font-size: 10px; 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        @media (prefers-color-scheme: dark) { .dot { background: white; color: black; } }

        #modal { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: var(--bg); 
            display: none; 
            z-index: 100; 
            overflow-y: auto; 
            padding: 25px; 
            box-sizing: border-box; 
        }
        .modal-top { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
        }
        .close { 
            background: #ff3b30; 
            color: white; 
            border: none; 
            padding: 8px 20px; 
            border-radius: 20px; 
            font-weight: 700; 
            cursor: pointer;
        }
        
        .macro-row { 
            display: flex; 
            justify-content: space-between; 
            padding: 6px 0; 
            border-bottom: 1px dotted var(--border); 
            font-size: 13px; 
        }
        .section { 
            background: var(--card); 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            margin-bottom: 15px; 
        }
        .section h4 { 
            margin: 0 0 10px; 
            color: var(--accent); 
            text-transform: uppercase; 
            font-size: 11px; 
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="nav-sticky">
        <div class="header">
            <img src="icon-left.png" alt="">
            <h1>Recipes</h1>
            <img src="icon-right.png" alt="">
        </div>
        <input type="text" id="search" placeholder="Search recipes..." oninput="render()">
        <div class="filters">
            <button class="f-btn active" onclick="setFilter('All', this)">ALL</button>
            <button class="f-btn" onclick="setFilter('Keto', this)">KETO</button>
            <button class="f-btn" onclick="setFilter('Heart', this)">HEART</button>
            <button class="f-btn" onclick="setFilter('Sugar', this)">LOW SUGAR</button>
        </div>
    </div>

    <div id="content"></div>

    <div id="modal">
        <div class="modal-top">
            <h2 id="mTitle" style="margin:0; font-size: 22px;"></h2>
            <button class="close" onclick="closeM()">DONE</button>
        </div>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:20px;">
            <div class="section"><h4>Per Portion</h4><div id="mPortion"></div></div>
            <div class="section"><h4>Full Recipe</h4><div id="mTotal"></div></div>
        </div>
        
        <div class="section">
            <h4>Ingredients</h4>
            <div id="mIng" style="white-space:pre-line; font-size: 14px;"></div>
        </div>
        
        <div class="section">
            <h4>Instructions</h4>
            <div id="mInst" style="white-space:pre-line; font-size: 14px;"></div>
        </div>
    </div>

    <script>
        let recipes = [];
        let currentFilter = 'All';

        async function loadData() {
            try {
                const response = await fetch('recipes.json');
                const data = await response.json();
                recipes = data.recipes;
                render();
            } catch (e) {
                console.error("Failed to load recipes. Check recipes.json location.", e);
            }
        }

        function setFilter(filterType, btn) {
            currentFilter = filterType;
            document.querySelectorAll('.f-btn').forEach(x => x.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        function render() {
            const container = document.getElementById('content');
            const query = document.getElementById('search').value.toLowerCase();
            container.innerHTML = '';

            const categories = ["Breakfasts", "Meals", "Bakery", "Desserts"];

            categories.forEach(cat => {
                const filteredList = recipes.filter(r => {
                    if (r.category !== cat) return false;
                    if (query && !r.title.toLowerCase().includes(query)) return false;
                    
                    if (currentFilter === 'Keto' && r.macros.carbs > 10) return false;
                    if (currentFilter === 'Heart' && r.macros.fat_sat > 3) return false;
                    if (currentFilter === 'Sugar' && r.macros.sugar > 5) return false;
                    
                    return true;
                });

                if (filteredList.length > 0) {
                    const sectionTitle = document.createElement('h2');
                    sectionTitle.style.cssText = "margin:25px 0 10px; font-size:20px; color:var(--accent);";
                    sectionTitle.innerText = cat;
                    container.appendChild(sectionTitle);

                    const grid = document.createElement('div');
                    grid.className = 'grid';

                    filteredList.forEach(r => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.onclick = () => openM(r);
                        card.innerHTML = `
                            <div class="badges">
                                ${r.macros.carbs <= 10 ? '<div class="dot" title="Keto Friendly">K</div>' : ''}
                                ${r.macros.fat_sat <= 3 ? '<div class="dot" title="Heart Healthy">♥</div>' : ''}
                                ${r.macros.sugar <= 5 ? '<div class="dot" title="Low Sugar">S</div>' : ''}
                            </div>
                            <h3>${r.title}</h3>
                            <div class="card-stats">
                                <div class="kcal">${Math.round(r.macros.kcal)} kcal</div>
                                <div class="vitals">P: ${r.macros.protein}g | C: ${r.macros.carbs}g | F: ${r.macros.fat}g</div>
                            </div>`;
                        grid.appendChild(card);
                    });
                    container.appendChild(grid);
                }
            });
        }

        function openM(r) {
            document.getElementById('mTitle').innerText = r.title;
            document.getElementById('mIng').innerText = r.ingredients;
            document.getElementById('mInst').innerText = r.instructions;
            
            document.getElementById('mPortion').innerHTML = buildMacroTable(r.macros, 1);
            document.getElementById('mTotal').innerHTML = buildMacroTable(r.macros, r.portions);
            
            document.getElementById('modal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeM() {
            document.getElementById('modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function buildMacroTable(m, multiplier) {
            const keys = [
                'kcal', 'fat', 'fat_sat', 'fat_poly', 'fat_mono', 
                'carbs', 'sugar', 'polyols', 'protein', 'fiber', 'salt'
            ];
            
            return keys.map(k => {
                const val = (m[k] * multiplier).toFixed(1);
                const label = k.replace('_', ' ').toUpperCase();
                return `<div class="macro-row"><span>${label}</span><span>${val}</span></div>`;
            }).join('');
        }

        window.onload = loadData;
    </script>
</body>
</html>
