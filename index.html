<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>Recipes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #ffffff;
    --card-bg: #f2f2f7;
    --text-primary: #000000;
    --text-secondary: #6c6c70;
    --search-bg: #e3e3e8;
    --border-color: #d1d1d6;
    --keto-bg: #000000;
    --keto-text: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --text-primary: #ffffff;
      --text-secondary: #aeaeb2;
      --search-bg: #1c1c1e;
      --border-color: #38383a;
    }
  }

  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-primary); -webkit-font-smoothing: antialiased; }

  .header { text-align: center; padding: 60px 20px 20px; font-size: 56px; font-weight: 800; letter-spacing: -2px; }
  .search-container { padding: 10px 16px 25px; }
  .search-bar { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--search-bg); color: var(--text-primary); font-size: 18px; box-sizing: border-box; outline: none; }

  .section-title { padding: 40px 16px 15px; font-size: 28px; font-weight: 800; text-align: center; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; padding: 0 16px 50px; }
  
  .card {
    background: var(--card-bg); border-radius: 18px; width: calc(50% - 6px); 
    height: 125px; position: relative; box-sizing: border-box; padding: 15px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  }

  .card-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; text-decoration: underline; text-underline-offset: 3px; line-height: 1.2; }
  .card-macros { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; line-height: 1.4; }

  .badge-right { position: absolute; top: 12px; right: 12px; }
  .keto-badge {
    background: var(--keto-bg); color: var(--keto-text); width: 22px; height: 22px; 
    border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800;
  }

  .popup-inner { padding: 60px 24px; max-width: 600px; margin: 0 auto; }
  .close-btn { position: fixed; top: 25px; right: 25px; font-size: 18px; font-weight: 800; cursor: pointer; background: var(--search-bg); padding: 10px 20px; border-radius: 25px; z-index: 1001; }
  
  .macro-container { display: flex; gap: 12px; margin-bottom: 25px; }
  .macro-box { flex: 1; background: var(--card-bg); padding: 18px; border-radius: 18px; font-size: 14px; line-height: 1.6; font-weight: 600; }
  
  .recipe-detail h1 { font-size: 38px; font-weight: 800; text-align: center; margin-bottom: 20px; }
  .recipe-detail h3 { border-bottom: 3px solid var(--border-color); padding-bottom: 10px; margin-top: 30px; font-size: 22px; font-weight: 800; }
  .recipe-detail ul, .recipe-detail ol { padding-left: 20px; color: var(--text-secondary); font-size: 18px; line-height: 1.6; }
</style>
</head>
<body>

<div class="header">Recipes</div>
<div class="search-container">
  <input type="search" id="searchInput" class="search-bar" placeholder="Search..." onkeyup="search()">
</div>

<div id="recipe-list"></div>

<div id="popup" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); display: none; overflow-y: auto; z-index: 1000;">
  <span class="close-btn" onclick="closePopup()">DONE</span>
  <div id="popup-content" class="popup-inner"></div>
</div>

<script>
let allRecipes = [];

fetch('recipes.json').then(res => res.json()).then(data => {
  allRecipes = data;
  render(allRecipes);
});

function render(data) {
  const container = document.getElementById('recipe-list');
  container.innerHTML = '';
  const order = ["Meals", "Bakery", "Desserts"];

  order.forEach(cat => {
    const filtered = data.filter(r => r.category === cat);
    if (filtered.length === 0) return;

    const title = document.createElement('div');
    title.className = 'section-title';
    title.innerText = cat;
    container.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'grid';
    filtered.forEach(r => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openPopup(r);
      
      let badge = '';
      if (r.designations?.includes("Keto")) badge = '<div class="keto-badge">K</div>';
      else if (r.designations?.includes("Heart")) badge = '❤️';

      card.innerHTML = `
        <div class="badge-right">${badge}</div>
        <div class="card-title">${r.title}</div>
        <div class="card-macros">
          ${r.macrosPerPortion.calories} KCAL • P: ${r.macrosPerPortion.protein}G<br>
          F: ${r.macrosPerPortion.fat}G • SAT: ${r.macrosPerPortion.satFat}G
        </div>`;
      grid.appendChild(card);
    });
    container.appendChild(grid);
  });
}

function openPopup(r) {
  const formatBox = (m, label) => `
    <div class="macro-box">
      <strong style="text-decoration: underline;">${label}</strong><br>
      ${m.calories} kcal<br>
      P: ${m.protein}g<br>
      C: ${m.carbs}g (Sugar: ${m.sugar}g)<br>
      F: ${m.fat}g (Sat: ${m.satFat}g)<br>
      <small>Poly: ${m.polyFat}g | Mono: ${m.monoFat}g</small>
    </div>`;

  document.getElementById('popup-content').innerHTML = `
    <div class="recipe-detail">
      <h1>${r.title}</h1>
      <div class="macro-container">
        ${formatBox(r.macrosPerPortion, "PER PORTION")}
        ${formatBox(r.macros, `TOTAL (${r.portions})`)}
      </div>
      <h3>Ingredients</h3>
      <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
      <h3>Method</h3>
      <ol>${r.instructions.map(s => `<li>${s}</li>`).join('')}</ol>
    </div>`;
  document.getElementById('popup').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function closePopup() { document.getElementById('popup').style.display = 'none'; document.body.style.overflow = 'auto'; }
function search() { 
  const q = document.getElementById('searchInput').value.toLowerCase(); 
  render(allRecipes.filter(r => r.title.toLowerCase().includes(q))); 
}
</script>
</body>
</html>
