<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipes</title>

<style>
body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
  background:#000;
  color:#fff;
}

.header{
  text-align:center;
  padding:20px;
  font-size:24px;
}

.search-bar{
  width:90%;
  margin:10px auto;
  display:block;
  padding:12px;
  border-radius:12px;
  border:none;
  background:#111;
  color:#fff;
}

.section-title{
  padding:10px 16px;
  font-weight:600;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:12px;
}

.card{
  background:#111;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
}

.error{
  color:red;
  padding:20px;
  white-space:pre-wrap;
}

.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  display:none;
  overflow:auto;
  padding:20px;
}

.close-btn{
  position:fixed;
  top:10px;
  right:15px;
  font-size:24px;
}
</style>
</head>

<body>

<div class="header">Recipes</div>

<input class="search-bar" placeholder="Search..." onkeyup="searchRecipes()">

<div id="recipes"></div>

<div id="popup" class="popup">
  <div class="close-btn" onclick="closePopup()">✕</div>
  <div id="popup-content"></div>
</div>

<script>

let recipes = [];

try {

recipes = [
  {
    title: "Turkey Burgers",
    category: "Meals",
    ingredients: ["400g turkey mince","egg"],
    instructions: ["Mix","Cook"],
    macrosPerPortion: {calories:310,protein:30,carbs:15,fat:12}
  },
  {
    title: "Mediterranean Chicken Bake",
    category: "Meals",
    ingredients: ["chicken","veg"],
    instructions: ["Bake"],
    macrosPerPortion: {calories:371,protein:50,carbs:10,fat:10}
  },
  {
    title: "Veggie Burger",
    category: "Meals",
    ingredients: ["veg","egg"],
    instructions: ["Cook"],
    macrosPerPortion: {calories:145,protein:6,carbs:15,fat:4}
  },
  {
    title: "Creamy Chicken and Broccoli Pasta",
    category: "Meals",
    ingredients: ["chicken","broccoli","pasta"],
    instructions: ["Cook","Mix"],
    macrosPerPortion: {calories:450,protein:45,carbs:50,fat:10}
  },
  {
    title: "Fillet Steak with Potatoes",
    category: "Meals",
    ingredients: ["steak","potatoes"],
    instructions: ["Cook"],
    macrosPerPortion: {calories:450,protein:40,carbs:45,fat:12.5}
  },
  {
    title: "Heart Healthy Bean Oat Cake",
    category: "Heart-Healthy Desserts",
    ingredients: ["beans","oats","eggs","cocoa"],
    instructions: ["Blend","Bake"],
    macrosPerPortion: {calories:138,protein:4.4,carbs:17.5,fat:4}
  }
];

} catch (e) {
  document.body.innerHTML = "<div class='error'>JS ERROR:\n" + e.message + "</div>";
}

function displayRecipes(data){

  const container = document.getElementById("recipes");
  container.innerHTML = "";

  let categories = {};

  data.forEach(r => {
    if(!categories[r.category]) categories[r.category] = [];
    categories[r.category].push(r);
  });

  for(let category in categories){

    container.innerHTML += `<div class="section-title">${category}</div>`;

    let grid = document.createElement("div");
    grid.className = "grid";

    categories[category].forEach(r => {

      let card = document.createElement("div");
      card.className = "card";
      card.onclick = () => openPopup(r);

      card.innerHTML = `
        <div>${r.title}</div>
        <div>${r.macrosPerPortion.calories} kcal</div>
      `;

      grid.appendChild(card);

    });

    container.appendChild(grid);
  }
}

function openPopup(recipe){

  const popup = document.getElementById("popup");
  const content = document.getElementById("popup-content");

  content.innerHTML = `
    <h2>${recipe.title}</h2>
    <h3>Ingredients</h3>
    <ul>${recipe.ingredients.map(i => `<li>${i}</li>`).join("")}</ul>
    <h3>Instructions</h3>
    <ol>${recipe.instructions.map(i => `<li>${i}</li>`).join("")}</ol>
  `;

  popup.style.display = "block";
}

function closePopup(){
  document.getElementById("popup").style.display = "none";
}

function searchRecipes(){
  const value = document.querySelector(".search-bar").value.toLowerCase();

  let filtered = recipes.filter(r =>
    r.title.toLowerCase().includes(value)
  );

  displayRecipes(filtered);
}

displayRecipes(recipes);

</script>

</body>
</html>
