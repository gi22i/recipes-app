<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipes</title>

<style>

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#121212;
color:white;
margin:0;
padding:0;
}

header{
padding:20px;
text-align:center;
font-size:26px;
font-weight:600;
background:#1e1e1e;
}

#search{
width:90%;
margin:15px auto;
display:block;
padding:12px;
border-radius:10px;
border:none;
font-size:16px;
}

.container{
display:grid;
grid-template-columns:1fr;
gap:15px;
padding:15px;
}

.card{
background:#1e1e1e;
border-radius:14px;
padding:16px;
cursor:pointer;
transition:0.2s;
}

.card:hover{
background:#2a2a2a;
}

.title{
font-size:18px;
font-weight:600;
margin-bottom:10px;
}

.macros{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.badge{
background:#333;
padding:6px 10px;
border-radius:8px;
font-size:13px;
}

.popup{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.8);
display:none;
align-items:center;
justify-content:center;
}

.popup-content{
background:#1e1e1e;
padding:20px;
border-radius:14px;
width:90%;
max-height:80%;
overflow:auto;
}

.close{
float:right;
font-size:20px;
cursor:pointer;
}

h3{
margin-top:20px;
}

ul,ol{
padding-left:18px;
}

</style>
</head>

<body>

<header>My Recipes</header>

<input id="search" placeholder="Search recipes...">

<div class="container" id="recipes"></div>

<div class="popup" id="popup">
<div class="popup-content">
<span class="close" onclick="closePopup()">✕</span>
<div id="recipeDetail"></div>
</div>
</div>

<script>

const url="https://raw.githubusercontent.com/gi22i/recipes-app/main/recipes.json";

let recipes=[];

fetch(url)
.then(r=>r.json())
.then(data=>{
recipes=data;
renderRecipes(data);
});

function renderRecipes(data){

const container=document.getElementById("recipes");
container.innerHTML="";

data.forEach(r=>{

let card=document.createElement("div");
card.className="card";

card.innerHTML=`

<div class="title">${r.title}</div>

<div class="macros">

<span class="badge">🔥 ${r.macros.calories || "-"} kcal</span>
<span class="badge">💪 ${r.macros.protein || "-"} g protein</span>
<span class="badge">🧈 ${r.macros.saturated || "-"} g sat fat</span>

</div>

`;

card.onclick=()=>openRecipe(r);

container.appendChild(card);

});

}

function openRecipe(r){

const detail=document.getElementById("recipeDetail");

detail.innerHTML=`

<h2>${r.title}</h2>

<h3>Ingredients</h3>
<ul>
${r.ingredients.map(i=>`<li>${i}</li>`).join("")}
</ul>

<h3>Instructions</h3>
<ol>
${r.instructions.map(i=>`<li>${i}</li>`).join("")}
</ol>

<h3>Macros</h3>

<ul>
<li>Calories: ${r.macros.calories || "-"}</li>
<li>Protein: ${r.macros.protein || "-"} g</li>
<li>Carbs: ${r.macros.carbs || "-"} g</li>
<li>Fat: ${r.macros.fat || "-"} g</li>
<li>Saturated fat: ${r.macros.saturated || "-"} g</li>
<li>Fibre: ${r.macros.fibre || "-"} g</li>
</ul>

`;

document.getElementById("popup").style.display="flex";

}

function closePopup(){
document.getElementById("popup").style.display="none";
}

document.getElementById("search").addEventListener("input",function(){

const term=this.value.toLowerCase();

const filtered=recipes.filter(r=>
r.title.toLowerCase().includes(term)
);

renderRecipes(filtered);

});

</script>

</body>
</html>
