<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipes</title>

<style>

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  margin:0;
  background:#111; /* Dark background */
  color:white;
}

header{
  background:#222;
  color:white;
  padding:16px;
  text-align:center;
  font-size:22px;
}

#search{
  width:90%;
  margin:15px auto;
  display:block;
  padding:10px;
  font-size:16px;
  border-radius:8px;
  border:none;
}

#recipes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); /* 2 per row on most screens */
  gap: 16px;
  padding: 10px;
}

.recipe{
  background:#333; /* Grey boxes */
  margin:0; /* gap handled by grid */
  padding:15px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  transition: transform 0.1s;
}

.recipe:hover{
  transform: scale(1.02);
}

.popup{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:rgba(0,0,0,0.7);
  display:none;
  align-items:center;
  justify-content:center;
  color:black;
}

.popup-content{
  background:white;
  width:90%;
  max-height:80%;
  overflow:auto;
  padding:20px;
  border-radius:10px;
}

.close{
  float:right;
  font-size:20px;
  cursor:pointer;
}

</style>
</head>

<body>

<header>Recipes</header>

<input id="search" placeholder="Search recipes">

<div id="recipes"></div>

<div class="popup" id="popup">
  <div class="popup-content">

    <span class="close" onclick="closePopup()">✕</span>

    <div id="recipeDetail"></div>

  </div>
</div>

<script>

const url="https://raw.githubusercontent.com/gi22i/recipes-app/main/recipes.json";

let recipes=[];

fetch(url)
.then(res=>res.json())
.then(data=>{
  recipes=data;
  renderRecipes(data);
})
.catch(err=>{
  console.error("Error loading recipes",err);
});

function renderRecipes(list){

  const container=document.getElementById("recipes");
  container.innerHTML="";

  list.forEach(r=>{

    let div=document.createElement("div");
    div.className="recipe";

    div.innerHTML=`
      <strong>${r.title}</strong><br>
      Calories: ${r.macros?.calories ?? "-"} |
      Protein: ${r.macros?.protein ?? "-"}g |
      Sat fat: ${r.macros?.saturated ?? "-"}g
    `;

    div.onclick=()=>openRecipe(r);

    container.appendChild(div);

  });

}

function openRecipe(r){

  const detail=document.getElementById("recipeDetail");

  detail.innerHTML=`
    <h2>${r.title}</h2>
    <h3>Ingredients</h3>
    <ul>
      ${r.ingredients.map(i=>`<li>${i}</li>`).join("")}
    </ul>
    <h3>Instructions</h3>
    <ol>
      ${r.instructions.map(i=>`<li>${i}</li>`).join("")}
    </ol>
    <h3>Macros</h3>
    <ul>
      <li>Calories: ${r.macros?.calories ?? "-"}</li>
      <li>Protein: ${r.macros?.protein ?? "-"} g</li>
      <li>Carbs: ${r.macros?.carbs ?? "-"} g</li>
      <li>Fat: ${r.macros?.fat ?? "-"} g</li>
      <li>Saturated fat: ${r.macros?.saturated ?? "-"} g</li>
      <li>Fibre: ${r.macros?.fibre ?? "-"} g</li>
    </ul>
  `;

  document.getElementById("popup").style.display="flex";

}

function closePopup(){
  document.getElementById("popup").style.display="none";
}

document.getElementById("search").addEventListener("input",function(){

  const term=this.value.toLowerCase();

  const filtered=recipes.filter(r=>
    r.title.toLowerCase().includes(term)
  );

  renderRecipes(filtered);

});

</script>

</body>
</html>
