<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Recipes</title>

<style>

body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
  background:#000;
  color:#fff;
}

/* Header */
.header{
  text-align:center;
  padding:20px 10px 10px;
  font-size:24px;
  font-weight:600;
}

/* Search */
.search-bar{
  width:90%;
  margin:10px auto;
  display:block;
  padding:12px;
  border-radius:12px;
  border:none;
  outline:none;
  font-size:16px;
  background:#111;
  color:#fff;
}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:12px;
}

/* Card */
.card{
  position:relative;
  background:linear-gradient(145deg,#111,#1a1a1a);
  border-radius:18px;
  padding:14px;
  box-shadow:0 6px 20px rgba(0,0,0,0.6);
  cursor:pointer;
}

/* Title */
.card-title{
  text-align:center;
  font-size:16px;
  font-weight:600;
  margin-bottom:6px;
}

/* Macros */
.macros{
  text-align:center;
  font-size:12px;
  opacity:0.8;
}

/* Watermark */
.watermark{
  position:absolute;
  top:8px;
  right:10px;
  font-size:22px;
  opacity:0.08;
}

/* Heart Badge */
.heart-badge{
  position:absolute;
  top:8px;
  left:10px;
  font-size:16px;
  opacity:0.85;
}

/* Popup */
.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  display:none;
  overflow-y:auto;
  padding:20px;
}

.popup h2{
  text-align:center;
}

.close-btn{
  position:fixed;
  top:15px;
  right:20px;
  font-size:24px;
  cursor:pointer;
}

/* Sections */
.section-title{
  padding:10px 16px 0;
  font-size:18px;
  font-weight:600;
  opacity:0.9;
}

</style>
</head>

<body>

<div class="header">Recipes</div>

<input type="text" class="search-bar" placeholder="Search recipes..." onkeyup="searchRecipes()">

<div id="recipes"></div>

<div id="popup" class="popup">
  <div class="close-btn" onclick="closePopup()">✕</div>
  <div id="popup-content"></div>
</div>

<script>

let recipes = []; // loaded from your JSON

async function loadRecipes(){
  const res = await fetch("recipes.json");
  recipes = await res.json();
  displayRecipes(recipes);
}

function displayRecipes(data){

  const container = document.getElementById("recipes");
  container.innerHTML = "";

  let categories = {};

  data.forEach(r => {
    if(!categories[r.category]) categories[r.category] = [];
    categories[r.category].push(r);
  });

  for(let category in categories){

    container.innerHTML += `<div class="section-title">${category}</div>`;

    let grid = document.createElement("div");
    grid.className = "grid";

    categories[category].forEach(r => {

      let heart = r.category === "Heart-Healthy Desserts" ? `<div class="heart-badge">❤️</div>` : "";

      let card = document.createElement("div");
      card.className = "card";
      card.onclick = () => openPopup(r);

      card.innerHTML = `
        ${heart}
        <div class="watermark">🍽️</div>
        <div class="card-title">${r.name}</div>
        <div class="macros">
          ${r.macros_per_portion.calories} kcal • 
          P ${r.macros_per_portion.protein} • 
          C ${r.macros_per_portion.carbs} • 
          F ${r.macros_per_portion.fat}
        </div>
      `;

      grid.appendChild(card);

    });

    container.appendChild(grid);
  }
}

function openPopup(recipe){
  const popup = document.getElementById("popup");
  const content = document.getElementById("popup-content");

  content.innerHTML = `
    <h2>${recipe.name}</h2>

    <h3>Ingredients</h3>
    <ul>${recipe.ingredients.map(i => `<li>${i}</li>`).join("")}</ul>

    <h3>Instructions</h3>
    <ol>${recipe.instructions.map(i => `<li>${i}</li>`).join("")}</ol>

    <h3>Macros (per portion)</h3>
    <p>
      ${recipe.macros_per_portion.calories} kcal<br>
      Protein: ${recipe.macros_per_portion.protein}g<br>
      Carbs: ${recipe.macros_per_portion.carbs}g<br>
      Fat: ${recipe.macros_per_portion.fat}g
    </p>
  `;

  popup.style.display = "block";
}

function closePopup(){
  document.getElementById("popup").style.display = "none";
}

function searchRecipes(){
  const value = document.querySelector(".search-bar").value.toLowerCase();

  let filtered = recipes.filter(r =>
    r.name.toLowerCase().includes(value)
  );

  displayRecipes(filtered);
}

loadRecipes();

</script>

</body>
</html>
